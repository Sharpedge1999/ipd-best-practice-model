    v: paraphrase-distorted
    s: low
    note: "Source (point 11) says such documents or data 'shall not be requested or submitted'; paraphrase weakens this to 'should not'. Rest of the paraphrase faithful (PDF 14-15 / chapter 1 printed 4-5)."
    corr: "Documents or data not foreseen by the Regulation (e.g. the ICH E6 progress report) shall not be requested or submitted based on recommendations in different guidelines."
