  R3-098: "Points 522-523, PDF 136-137 / chapter 11 printed 1-2; source uses 'should' for completing the analysis and submitting within the period."
  R3-100: "Points 498-499, PDF 131-132 / chapter 10 printed 8-9."
  R3-104: "Points 365-367, PDF 95 / chapter 7 printed 22. Point 368 (USM requiring protocol update to be followed by SM submission, printed 23) supports the cross-reference in R3-030."
  R3-105: "Points 525-527, PDF 137 / chapter 11 printed 2; the Q&A bases the obligation on Art. 53."
except:
