open_items:
  - "[verify interface] Neighbouring process 'Quality assurance and audit': its findings enter L4-04/L4-05 as potential deviations or noncompliance and its CAPA requests enter this step. Interface REQs: REQ-208."
  - "[verify interface] Neighbouring process 'Protocol amendment (21 CFR 312.30; EU CTR Chapter III)' runs when an amendment is the corrective action; the sources define no decision point inside this step. Interface REQs: REQ-221, REQ-222."
  - "[verify interface] Neighbouring processes 'Restart after temporary halt (EU CTR)' and 'Discontinuation for unreasonable risk (21 CFR 312.56(d))' are safety and trial status processes. Interface REQs: REQ-223, REQ-226."

notes:
  - "C-10: the binding US either-or duty (REQ-135, 21 CFR 312.56(b)) sits on A3 'Secure compliance' (before the ICH 'consider termination' decision A8) and on A10, instead of a separate US branch, to keep the model within 31 nodes; its 'end participation' alternative is the termination path G6-G7-A10-E2."
  - "C-15: root cause analysis in the Sponsor lane (REQ-136, REQ-138); the investigator's own preventive measures are task A14 (REQ-133)."
  - "Monitor lane for A2 per C-25 (E6R3 A1-3.11.4.5.1 gerund items)."
