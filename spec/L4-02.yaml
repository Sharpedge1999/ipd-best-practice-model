    party: "sponsor"
  - id: G3
    type: xor-split
    label: "Potential protocol deviation identified?"
    lane: L_SPON
    path: main
  - id: A12
    type: task
    label: "Communicate detected deviations to investigator"
    lane: L_SPON
    path: main
    src:
      - {key: E6R3, loc: "A1-2.5.3", page: "printed 13 / PDF 21"}
      - {key: E6R3, loc: "A1-3.11.4.5.1(b)", page: "printed 32 / PDF 40"}
      - {key: FDA-RBM23, loc: "SQ8", page: "printed 10"}
    req: [REQ-047, REQ-053]
    binding: binding-ICH
    jurisdiction: [ICH, US]
    party: "sponsor"
    verify:
      - "[verify] gerund item; Monitor lane inferred from A1-3.11.4.4 and A1-3.11.4.5.1(a) (R1 C7)"
  - id: E1
    type: end
    label: "Potential protocol deviation identified"
    lane: L_SPON
    path: main
  - id: E2
    type: end
    label: "Monitoring completed without finding"
    lane: L_SPON
    path: exception
  - id: S2
    type: start
    label: "Protocol deviation identified at site"
    pool: P_INV
    path: main
  - id: A13
    type: task
    label: "Document protocol deviation"
