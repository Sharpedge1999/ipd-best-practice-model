    name: "Sponsor"
    pool: P_SPON
    src:
      - {key: E6R3, loc: "GL:Sponsor", page: "printed 90 / PDF 98"}
      - {key: EUCTR, loc: "Art. 2(2)(14)", page: "OJ L 158/12"}
      - {key: 21CFR312, loc: "21CFR312.50", page: "n/a - eCFR web text without pagination"}
  - id: L_MON
    name: "Monitor"
    pool: P_SPON
    src:
      - {key: E6R3, loc: "A1-3.11.4.5.1(a)", page: "printed 32 / PDF 40"}
      - {key: E6R3, loc: "A1-3.11.4.4", page: "printed 32 / PDF 40"}

nodes:
  - id: S1
    type: start-timer
    label: "Monitoring activity scheduled"
    lane: L_SPON
    path: main
    src:
      - {key: EUCTR, loc: "Art. 48", page: "OJ L 158/39"}
      - {key: 21CFR312, loc: "21CFR312.50", page: "n/a - eCFR web text without pagination"}
      - {key: 21CFR312, loc: "21CFR312.56(a)", page: "n/a - eCFR web text without pagination"}
    req: [REQ-048, REQ-049]
    binding: binding-law
    jurisdiction: [EU, US]
    deadline: "continuous"
    party: "sponsor"
  - id: G1
    type: or-split
    label: "Which monitoring channels are due?"
    lane: L_SPON
    path: main
    justification: "Centralised monitoring can complement and reduce site monitoring or be used on its own (E6R3 A1-3.11.4.2(b)) and site visit frequency follows the risks (A1-3.11.4.1(a)), so one or both channels run in a cycle (FLW-07, DEC-02). Both outgoing flows are conditional and there is no default flow: the trigger 'Monitoring activity scheduled' guarantees at least one channel, and a default flow would wrongly suppress centralised review whenever a site visit is due (an OR default flow runs only when no other condition holds). XOR rejected: the channels are not exclusive."
  - id: A1
    type: task
    label: "Review trial data for protocol deviations"
    lane: L_SPON
    path: main
    group: GR_CENTRAL
    src:
      - {key: E6R3, loc: "A1-3.11.4.5.4(b)(ii)", page: "printed 34 / PDF 42"}
      - {key: E6R3, loc: "A1-3.11.4.2(a)", page: "printed 31 / PDF 39"}
      - {key: E6R3, loc: "A1-3.11.4.2(b)", page: "printed 31 / PDF 39"}
      - {key: E8R1, loc: "S6.1.3", page: "printed 18"}
      - {key: E8R1, loc: "S3.3.2", page: "printed 6"}
      - {key: E6R3, loc: "A1-3.11.3", page: "printed 30 / PDF 38"}
      - {key: E6R3, loc: "A1-3.16.1(b)", page: "printed 39 / PDF 47"}
      - {key: E6R3, loc: "A2-3.8", page: "printed 62 / PDF 70"}
      - {key: E6R3, loc: "A1-3.11.4.5.4(c)", page: "printed 34 / PDF 42"}
      - {key: FDA-RBM13, loc: "SIII.B", page: "printed 8"}
      - {key: FDA-PD24, loc: "SIII.B.2", page: "printed 6; lines 227-228; printed 9; lines 314-317"}
      - {key: TCB-PD-TIRS, loc: "SIdentify-and-Collect", page: "journal pp. 733-742 (section page not confirmed; PMC HTML read)"}
    req: [REQ-037, REQ-036, REQ-035, REQ-038, REQ-040, REQ-041]
    binding: binding-ICH
    jurisdiction: [ICH, US]
    draft: true
    deadline: "timely (REQ-036); early (REQ-041)"
    record: "centralised monitoring report; deviation listings; oversight / monitoring plan"
    party: "sponsor; CRAs; site monitors and centralized monitoring"
    verify:
      - "[verify] gerund item under A1-3.11.4.5; actor not named (R1 C7)"
      - "[verify binding] EU/US adoption of E8R1 not checked by the research stems (C-06)"
      - "[verify] R1-089 is Annex 2: effective in the EU from 15 Jan 2027; FDA Annex 2 guidance still draft (C-06)"
      - "[verify] basis is draft guidance only - shown as DRAFT, never a binding step"
  - id: A2
    type: task
    label: "Review audit trails and metadata"
    lane: L_SPON
    path: main
    group: GR_CENTRAL
    src:
      - {key: E6R3, loc: "A1-4.2.3", page: "printed 47 / PDF 55"}
    req: [REQ-039]
    binding: binding-ICH
    jurisdiction: [ICH]
    party: "responsible party"
    verify:
      - "[verify] section 4 duty of the 'responsible party' (investigator or sponsor); Sponsor lane chosen (R1 C14)"
  - id: A3
    type: task
    label: "Evaluate acceptable range exceedance"
    lane: L_SPON
    path: main
    group: GR_CENTRAL
    src:
      - {key: E6R3, loc: "A1-3.10.1.3", page: "printed 28 / PDF 36"}
      - {key: TCB-RBQM, loc: "SRelationship-Between-QTLs-and-KRIs", page: "journal pp. 251-261 (section page not confirmed)"}
      - {key: TCB-RBQM, loc: "SMonitor-Process-Stage", page: "journal pp. 251-261 (section page not confirmed)"}
    req: [REQ-044]
    binding: binding-ICH
    jurisdiction: [ICH]
    party: "sponsor"
    verify:
      - "[verify] 'deviation beyond these ranges' is a range exceedance, not a protocol deviation (C-04)"
  - id: A4
    type: task
    label: "Review deviation trends"
    lane: L_SPON
    path: main
    group: GR_CENTRAL
    src:
      - {key: FDA-PD24, loc: "SIII.B.2", page: "printed 8; lines 262-265"}
      - {key: FDA-RBM23, loc: "SQ5", page: "printed 7-8"}
      - {key: TCB-PD-TIRS, loc: "SConfirm", page: "journal pp. 733-742 (section page not confirmed; PMC HTML read)"}
      - {key: TCB-PD-TIRS, loc: "SClassify-and-Categorize", page: "journal pp. 733-742 (section page not confirmed; PMC HTML read)"}
      - {key: TCB-PD-TIRS, loc: "SReview-and-Analyze", page: "journal pp. 733-742 (section page not confirmed; PMC HTML read)"}
    req: [REQ-046, REQ-045]
    binding: guidance
    jurisdiction: [ICH, US]
    draft: true
    deadline: "periodically (frequency per deviation assessment plan)"
    record: "trend review output; monitoring plan; deviation tracking"
    party: "Study teams; Sponsors"
    verify:
      - "[verify] single fetch (R5-025)"
      - "[verify] basis is draft guidance only - shown as DRAFT, never a binding step"
  - id: A5
    type: task
    label: "Select sites for targeted monitoring"
    lane: L_SPON
    path: main
    group: GR_CENTRAL
    src:
      - {key: E6R3, loc: "A1-3.11.4.2(c)", page: "printed 31 / PDF 39"}
      - {key: FDA-RBM13, loc: "SIV.D.1", page: "printed 15"}
      - {key: FDA-RBM23, loc: "SQ4", page: "printed 7"}
    req: [REQ-042, REQ-043]
    binding: binding-ICH
    jurisdiction: [ICH, US]
    deadline: "promptly"
    party: "sponsor"
  - id: A6
    type: task
    label: "Perform site monitoring visit"
    lane: L_MON
    path: main
    group: GR_SITE
    src:
      - {key: E6R3, loc: "A1-3.11.4.1(a)", page: "printed 31 / PDF 39"}
      - {key: E6R3, loc: "GL:Monitoring", page: "printed 88 / PDF 96"}
      - {key: E6R3, loc: "A1-3.11.4.4", page: "printed 32 / PDF 40"}
      - {key: E6R3, loc: "A1-3.11.4.5.1(a)", page: "printed 32 / PDF 40"}
      - {key: FDA-RBM23, loc: "SQ3", page: "printed 5-7"}
    req: [REQ-050, REQ-051, REQ-052, REQ-057]
    binding: binding-ICH
    jurisdiction: [ICH, US]
    deadline: "early in site conduct"
    record: "monitoring report"
    party: "sponsor; persons performing monitoring; assigned monitor as site contact point"
  - id: A7
    type: task
    label: "Verify protocol adherence at site"
    lane: L_MON
    path: main
    group: GR_SITE
    src:
      - {key: E6R3, loc: "A1-3.11.4.5.2(b)", page: "printed 32-33 / PDF 40-41"}
      - {key: E6R3, loc: "A1-3.11.4.5.2(i)", page: "printed 33 / PDF 41"}
      - {key: TCB-PD-TIRS, loc: "SIdentify-and-Collect", page: "journal pp. 733-742 (section page not confirmed; PMC HTML read)"}
    req: [REQ-054, REQ-058]
    binding: binding-ICH
    jurisdiction: [ICH]
    party: "sponsor; CRAs"
