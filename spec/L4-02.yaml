    req: [REQ-055]
    binding: binding-ICH
    jurisdiction: [ICH]
    party: "sponsor"
    verify:
      - "[verify] gerund item; Monitor lane inferred (R1 C7)"
  - id: A9
    type: task
    label: "Request correction of source record errors"
    lane: L_MON
    path: main
    group: GR_SITE
    src:
      - {key: E6R3, loc: "A1-3.11.4.5.1(c)", page: "printed 32 / PDF 40"}
    req: [REQ-056]
    binding: binding-ICH
    jurisdiction: [ICH]
    record: "corrected data with audit trail"
    party: "sponsor"
    verify:
      - "[verify] gerund item; Monitor lane inferred (R1 C7)"
  - id: G2
    type: or-join
    lane: L_SPON
    path: main
  - id: A10
    type: task
    label: "Document monitoring report"
    lane: L_MON
    path: main
    src:
      - {key: E6R3, loc: "A1-3.11.4.6(a)", page: "printed 34 / PDF 42"}
      - {key: E6R3, loc: "GL:Monitoring Report", page: "printed 88 / PDF 96"}
      - {key: E6R3, loc: "A1-3.11.4.6(c)", page: "printed 35 / PDF 43"}
      - {key: FDA-RBM13, loc: "SV", page: "printed 17"}
      - {key: FDA-RBM23, loc: "SQ8", page: "printed 9-10"}
    req: [REQ-059, REQ-061]
    binding: binding-ICH
    jurisdiction: [ICH, US]
    record: "monitoring report"
    party: "sponsor"
  - id: A11
    type: task
    label: "Review monitoring reports"
    lane: L_SPON
    path: main
    src:
      - {key: E6R3, loc: "A1-3.11.4.6(b)", page: "printed 35 / PDF 43"}
      - {key: FDA-RBM13, loc: "SV", page: "printed 17"}
      - {key: FDA-RBM23, loc: "SQ8", page: "printed 9-10"}
    req: [REQ-060]
    binding: binding-ICH
    jurisdiction: [ICH, US]
    deadline: "timely (US guidance: promptly)"
