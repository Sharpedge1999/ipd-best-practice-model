    binding: binding-ICH
    jurisdiction: [ICH, US]
    draft: true
    deadline: "per sponsor-specified timeframe (REQ-066); promptly (REQ-067)"
    record: "deviation report; documentation and explanation of premature unblinding"
    party: "investigator"
    verify:
      - "[verify] basis is draft guidance only - shown as DRAFT, never a binding step"
      - "[verify] E6(R3) does not label premature unblinding a protocol deviation; trial-specific criteria decide (R1 C13)"
  - id: G4
    type: or-split
    label: "Which additional reports are due?"
    pool: P_INV
    path: main
    justification: "Every deviation is reported to the sponsor (A14, before the split: deviation report, FDA-PD24 SIII.B.1, DRAFT, including the premature unblinding explanation, E6R3 A1-2.11). One deviation can in addition require the computerised system incident report (E6R3 A1-2.12.10(e)) and, in the EU, the suspected serious breach report (EMA-SB S6.4); both can apply together (FLW-07, DEC-02). Default flow 'No further report' to the OR join when neither applies."
  - id: A15
    type: task
    label: "Report computerised system incident"
    pool: P_INV
    path: alt
    src:
      - {key: E6R3, loc: "A1-2.12.10(e)", page: "printed 22 / PDF 30"}
    req: [REQ-068]
    binding: binding-ICH
    jurisdiction: [ICH]
    party: "investigator/institution"
  - id: A16
    type: task
    label: "Report suspected serious breach to sponsor"
    pool: P_INV
    path: alt
    group: GR_EU
    src:
      - {key: EMA-SB, loc: "S6.4", page: "printed 9-10/21"}
    req: [REQ-069]
    binding: guidance
    jurisdiction: [EU]
    deadline: "promptly"
    record: "site process / SOP"
    party: "Principal Investigator"
  - id: G5
    type: or-join
    pool: P_INV
    path: main
  - id: E3
    type: end
    label: "Deviation reported to sponsor"
    pool: P_INV
    path: main

