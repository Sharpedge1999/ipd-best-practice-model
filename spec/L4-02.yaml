open_items:
  - "[verify interface] Neighbouring process 'Data governance and computerised systems' configures the audit trails and metadata that A2 reviews; set-up process without a flow hand-off, so no placeholder element. Interface REQs: REQ-209."
  - "[verify interface] Neighbouring process 'Safety reporting' (SAE to sponsor, EU CTR Art. 41(2), 24 h) runs in parallel when a deviation causes an SAE; the investigator OR split already has 3 branches (FLW-06). Interface REQs: REQ-214."

notes:
  - "SCP-03: 16 activities (target 5-15) - user decision 06 Nov 2026 to merge identification channels; 26 nodes, within 31."
  - "Sponsor-to-investigator flows M1 and M2 end on the Investigator/institution pool: a target node would form a cycle with the investigator's reports (layout constraint), and the investigator's review of communicated deviations is modelled in L4-04. Investigator reports enter the sponsor where they are reviewed: deviation report and premature unblinding explanation in centralised data review A1 (FDA-PD24 SIII.B.2: sponsors receive deviation information mainly through monitoring), system incident and suspected serious breach reports in the sponsor review A11, which takes the detection decision."
  - "Legal monitoring duties (EU CTR Art. 48, 21 CFR 312.50/312.56(a)) sit on the timer start event because they cover both channels."
  - "A10 'Document monitoring report' follows the OR join G2 (V1 round 1): a monitoring report follows site and/or centralised monitoring activities (E6R3 GL:Monitoring Report, REQ-059), so both channels feed the sponsor review A11; Monitor lane because REQ-059 places the report on the monitor."
