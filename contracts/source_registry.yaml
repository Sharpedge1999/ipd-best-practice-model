#   version_read    version / date of the document actually read
#   retrieval       retrieval channel and date
#   local_text      local text copy (vendor/sources/INDEX.md) or null
#   notes           free text
# Top-level 'gaps' lists the source and coverage gaps recorded by the stems and Y1.

