  - binding_route
  action: strip
  evidence: 'ICH regional adoption of E3, E3 Q&A, E8(R1), E9, E9(R1), M11 not checked: general statement G-ADOPTION. Also
    strips the marker on REQ-236 (FDA eStudy guidance, FD&C Act 745A(a)), which the note ''Shown as law'' covers.'
- tag: '[verify] '
  fields:
  - binding_route
  action: strip
  evidence: 'Finding routes ''EU: [verify] via EU CTR Art. 47 / EMA adoption'' (E6(R3); adoption documented: EU CTR Art. 47,
    vendor/sources/EMA-E6R3/doc_13.txt lines 26-27) and ''[verify] ICH Step 4 guideline; EU route owned by R3, US route owned
    by R4'' (E3, E3 Q&A, E8(R1), E9, E9(R1), M11): general statement G-ADOPTION.'
- tag: ' [verify R3]'
  fields:
  - binding_route
  action: strip
  evidence: 'EMA page confirms Annex 2 effective 15 January 2027: vendor/sources/EMA-E6R3/doc_13.txt lines 27 and 44.'
- tag: '[verify R4 whether Annex 2 adopted]'
  fields:
  - binding_route
  action: replace
  with: (FDA Annex 2 still draft)
  evidence: 'FDA page lists E6(R3) Annex 2 as draft guidance: vendor/sources/FDA-E6R3-A2/doc_31.txt lines 64-81.'
- tag: FDA-SDTCG [verify]
  fields:
  - binding_route
  action: replace
  with: FDA-SDTCG
  evidence: 'R5-065, R5-066 route: FDA-ESTUDY names CDISC CT (vendor/sources/FDA-ESTUDY/doc_42.txt lines 340-354) and FDA-SDTCG
    S4.1.1.3 recommends the DV variables (page 16 of 97). That CDISC CT is listed in the Data Standards Catalog rests on the
    unread Catalog, which is the open point ''SDTM/SDTMIG versions supported by FDA''.'
- tag: Data Standards Catalog [verify]
