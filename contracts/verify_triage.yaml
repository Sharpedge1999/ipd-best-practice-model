general:
  G-ADOPTION:
    wording: 'ICH guidelines apply through regional adoption. E6(R3) adoption is documented (EU: EU CTR Art. 47, EMA dates;
      US: FDA guidance); for E3, E3 Q&A, E8(R1), E9, E9(R1) and M11 it was not checked. In the US they are nonbinding guidance.'
    evidence: 'Brief wording needs correction: it says adoption was not checked guideline by guideline and that ICH guidelines
      ''bind'' through EMA and FDA. contracts/source_registry.yaml: E6R3 notes EU effective dates (Principles and Annex 1
      23 Jul 2025, Annex 2 15 Jan 2027) and US FDA guidance; FDA-E6R3 ''US adoption of ICH E6(R3): nonbinding guidance; 21
      CFR binds''; E3, E8R1, E9, E9R1 ''EU/US adoption not checked [verify binding]'', E3QA ''regional adoption not checked'',
      M11 ''regional implementation date not checked'', M11-TEMPLATE ''regional route [verify binding]''. synthesis/requirements.yaml
      binding_route: E6R3 route (97 REQs) names EU CTR Art. 47 ''appropriate account'', EMA dates and ''US: FDA guidance,
      nonbinding ... binding only where 21 CFR restates it''; E3, E3QA, E8R1, E9, E9R1, M11, M11-TEMPLATE routes say ''EU
      and US adoption ... not checked by the research stems [verify binding]; in the US ICH guidelines are guidance only''.
      merged_findings.yaml: FDA-E6R3 (final, nonbinding) and FDA-E6R3-A2 (Annex 2 draft) routes. synthesis/conflicts.md C-06
      Side C: ''Adoption of E8(R1), E3, E3 Q&A, E9, E9(R1) and M11 was not checked''. Local texts: vendor/sources/EUCTR-OJ
      Art. 47 second paragraph (''take appropriate account of ... the ICH guidelines on good clinical practice'' - GCP only,
      so it does not carry E3 or E9); vendor/sources/EMA-E6R3/doc_13.txt lines 26-27 effective dates; vendor/sources/FDA-E6R3/doc_30.txt
      ''Contains Nonbinding Recommendations''; vendor/sources/FDA-E6R3-A2/doc_31.txt ''Draft Guidance''. All [verify binding]
      texts in in_*.json name only E3, E3QA, E8R1, E9, E9R1, M11, M11-TEMPLATE, so the corrected wording covers them. The
      Annex 2 text in L4-02 (R1-089, REQ-035) concerns E6(R3) dates and is covered by the documented-adoption clause or a
      note, not by ''not checked''.'
  G-RETRIEVAL:
    wording: 'Some page numbers or wordings rest on a single retrieval or could not be compared with a stored copy. The blind
      source check covered 427 of 537 findings, all binding ones included: 414 confirmed directly, 13 after correction or
      re-check.'
    evidence: 'Brief numbers are right for the first pass but ''sampled'' is misleading and the re-check is missing. verification/X1_summary.md:
      427 items, first pass 414 confirmed, 13 not confirmed (0 high, 3 medium, 10 low); section ''Re-check (gate G4)'': all
      16 entries of x1_corrections.yaml confirmed, 12 corrected, R2-102 was an X1 error, ''Totals after re-check across the
      427 items: 427 confirmed, 0 non-confirmed''. synthesis/verification_worklist.yaml meta: selection ''100% of binding-law
      and binding-ICH findings; every finding with a quote; deterministic 25% sample of guidance and best-practice findings''
      (340 binding, 197 pool, 50 sampled, 427 total); 537 findings in synthesis/merged_findings.yaml (README.md also says
      537). Not fully checkable per X1_summary.md: TCB-PD, TCB-RBQM, NCIT-DV (no usable local text, WebFetch only), TCB-PD-TIRS
      journal pages (PMC HTML). Guidance or best-practice findings outside the 25% sample were not checked by X1 (for example
      R3-097, R4-084, R4-085, R5-047).'
  G-DRAFT:
    wording: A requirement whose only regulatory basis is draft guidance carries the DRAFT badge and counts as guidance, never
      as binding. Where a step also has binding requirements, DRAFT appears next to its LAW or ICH badge.
    evidence: 'out/citations.json: the text ''[verify] basis is draft guidance only - shown as DRAFT, never a binding step''
      sits on 21 distinct REQs (REQ-012, 013, 026, 034, 041, 046, 066, 074, 076, 077, 087, 089, 100, 101, 122, 123, 132, 139,
      153, 169, 186) on 37 elements. All 37 elements carry the DRAFT badge; all 21 REQs have draft true and binding guidance;
      no draft REQ is binding-law or binding-ICH; all 21 draft REQs on the map carry the text; no element with a draft REQ
      lacks the badge. The 9 elements whose REQs are all draft (L4_01_A13, L4_01_A7, L4_02_M3, L4_03_A7, L4_03_M5, L4_04_A7,
      L4_04_M3, L4_05_A10, L4_05_M7) have binding guidance. But 25 of the 37 elements show LAW or ICH (L3_A1 to L3_A7, L3_M1,
      L3_M9, L3_M12, L4_01_A15, L4_01_M1, L4_02_A1, L4_02_A14, L4_03_A2, L4_03_A10, L4_03_A12, L4_03_A14, L4_03_M3, L4_04_A1,
      L4_06_A2, L4_06_A4, L4_06_A8, L4_07_A11, L4_07_M1) because each also has a non-draft binding REQ (spec/notes.md: element
      binding = strongest REQ binding, draft true if any REQ is draft), so the step itself is binding and ''never a binding
      step'' needs the rewording above; viewer/src/app.js legend already says ''Rests (also) on draft guidance - shown next
      to the binding badge''. 6 of the 21 REQs (REQ-013, 034, 041, 046, 101, 186) also cite best-practice sources, hence ''only
      regulatory basis''. requirements.yaml has 24 draft REQs: REQ-229 (interface, named only in an L4-05 model_doc open item)
      and out-of-scope REQ-261, REQ-265 are not on map elements. Related texts that are not G-DRAFT: the R1-089 Annex 2 text
      sits on REQ-035 with draft false (its elements L3_A2, L4_02_A1 show DRAFT only through REQ-041 and others); the C-02
      text (REQ-013) and the DVCLASI text (REQ-186) are on draft REQs and DRAFT elements but say more than the general statement.'
  G-LOCATION:
    wording: For a few sources without a usable stored copy (an industry web page, a CTIS training guide) the exact section
      label or page could not be confirmed; the content is cited from the named document.
    evidence: 'All 11 source entries in out/citations.json with ''[verify]'' in loc or page (12 findings) checked. Only three
      fit the statement: TCB-PD CLOSEOUT and REVIEW-ANALYZE (R5-046, R5-047; carousel tab inferred; no local copy, INDEX.md:
      toolkit host robots-restricted; X1 checked R5-046 by WebFetch only) and CTIS-TM05 ''Other notifications'' (R3-097; vendor/sources/CTIS-TM05/doc_17.txt
      is an EMA ''Page or document not found'' page although INDEX.md lists it as a local text). The other eight are settled
      by the local text and should be drop, not G-LOCATION: E9 5.2.2 printed 23-24 and 24 (R2-086, R2-087, X1 confirmed),
      E9 5.2.3 printed 24 (R2-090, X1 confirmed), E3 Annex IVa printed 35 (R2-064, X1 confirmed), FDA-SDTCG 4.1.1.3 Page 16
      of 97 (R5-069, R5-070, X1 confirmed), M11-TEMPLATE conventions = Section 0.3 ''Template Conventions and General Instructions'',
      printed iv-viii (R2-112, X1 confirmed), FDA-RBM13 IV.D.1 and IV.D.2 (R4-084, R4-085, not in X1): vendor/sources/FDA-RBM13/doc_32.txt
      PDF 18-19 and TOC put the IV.D.1 bullet ''possible deviations or failures that would be critical to study integrity
      and how these are to be recorded and reported'' on printed 15 and IV.D.2 on printed 15-16, so IV.D.1 is the right section.'
