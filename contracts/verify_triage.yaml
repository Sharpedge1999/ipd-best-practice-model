# Verify triage for the interactive map (tools/build_viewer.py --verify-triage).
# One entry per raw "[verify]" text of the model, requirements and findings. The raw texts stay unchanged in
# spec/, out/*.bpmn, synthesis/ and register/; this file only decides how the map shows them:
#   open    - VERIFY badge and a yellow box with the general wording (a reviewer must look)
#   note    - plain note in the side panel, no badge
#   general - covered by one general statement in the legend (general:)
#   drop    - settled at the source; not shown
# Triage per level against the local source texts (vendor/sources), X1 results and synthesis/conflicts.md;
# evidence records what was checked.
inline:
- tag: 16 or 17 of 97 [verify]
  fields:
  - page
  action: replace
  with: 16 of 97
  evidence: 'FDA-SDTCG S4.1.1.3: the DV domain text lies between the footers ''Page 15 of 97'' and ''Page 16 of 97'' (vendor/sources/FDA-SDTCG/doc_41.txt
    lines 1405-1456); X1 confirmed R5-069 and R5-070 on page 16.'
- tag: SConventions [verify]
  fields:
  - loc
  action: replace
  with: S0.3
  evidence: 'M11 template: the conventions part is Section 0.3 ''Template Conventions and General Instructions'' (vendor/sources/M11-TEMPLATE/doc_9.txt
    line 81); X1 confirmed R2-112.'
- tag: printed iv-vii
  fields:
  - page
  action: replace
  with: printed iv-viii
  evidence: M11 template Section 0.3 runs over printed iv-viii; 'Remove all instructional text' is on printed viii (doc_9.txt
    line 254).
- tag: ' [verify binding]'
