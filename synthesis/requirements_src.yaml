# Y1 authoring input for synthesis/requirements.yaml (built by tools/y1_build.py).
# One entry = one atomic requirement in own words. REQ ids are assigned in file order.
# Re-entry 06 Nov 2026: steps renumbered after the user merged identification (old A2+A3 -> A2); REQ order unchanged.
# Keys: k mnemonic | s statement | p party_norm | a action | t trigger | d deadline |
#       r recipient | rec record | f finding ids | st l3 step (A1..A8), OOS, or INT:<near step> |
#       why reason (OOS/INT) | v open verify items | dup {finding: canonical finding}
# Omitted t/d/r/rec default to the first finding's value (deadline 'none' if empty).
# binding, draft, binding_route and jurisdiction are derived from the findings by the build.

