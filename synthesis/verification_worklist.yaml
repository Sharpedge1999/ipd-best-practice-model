  page: printed 4-5 (chapter 1; page numbers restart per chapter)
  paraphrase: 'Q&A 1.5: sponsors and investigators must comply with applicable regulatory requirements; the EU CTR aims at maximum harmonisation and takes precedence over conflicting rules in guidelines, including ICH GCP. Documents not foreseen by the Regulation should not be requested or submitted on the basis of other guidelines.'
