- id: R5-071
  src: FDA-ESTUDY
  doc: 'FDA Guidance for Industry: Providing Regulatory Submissions in Electronic Format - Standardized Study Data, Revision 2, June 2021'
  url: https://www.fda.gov/media/82716/download
  loc: SII.E.1
  page: printed 8 (S II.E.1, lines 234-248); printed 3 (S I, lines 36-42); printed 5 (S II.C)
  paraphrase: To the extent it specifies the electronic format, this guidance has binding effect under FD&C Act section 745A(a). Study data in NDA, ANDA, certain BLA and certain IND submissions must use the FDA-supported standards in the Data Standards Catalog (SDTM and CDISC CT are named), for studies starting from 18 Dec 2016 (NDA, ANDA, BLA) or 18 Dec 2017 (certain INDs); noncommercial INDs are exempt. Nonconforming submissions may be refused to file or receive.
