  src: FDA-PD24
  doc: Protocol Deviations for Clinical Investigations of Drugs, Biological Products, and Devices - Draft Guidance for Industry, December 2024 (CDER, CBER, CDRH, OCE; docket FDA-2023-D-5016)
  url: https://www.fda.gov/media/184745/download
  loc: SIII.B.3
  page: printed 10; lines 351-353
  paraphrase: Where possible, FDA recommends that the investigator submit important protocol deviations to the IRB when they are identified, following the IRB's written procedures.
  quote: ''
  local_text: vendor/sources/FDA-PD24/doc_29.txt
- id: R4-075
  src: FDA-PD24
  doc: Protocol Deviations for Clinical Investigations of Drugs, Biological Products, and Devices - Draft Guidance for Industry, December 2024 (CDER, CBER, CDRH, OCE; docket FDA-2023-D-5016)
  url: https://www.fda.gov/media/184745/download
  loc: SIII.C
  page: printed 10; lines 360-363
  paraphrase: Protocol changes are generally not implemented until IRB review and approval and, in some cases, FDA review; changes to protocol-specified procedures made without prior IRB approval and without submitting the implementing amendment to FDA are protocol deviations.
  quote: ''
  local_text: vendor/sources/FDA-PD24/doc_29.txt
- id: R4-078
  src: FDA-E6R3
  doc: E6(R3) Good Clinical Practice - Guidance for Industry (ICH), September 2025, FDA CDER/CBER, docket FDA-2023-D-1955; Federal Register notice 90 FR 43460, 9 Sep 2025
  url: https://www.fda.gov/media/169090/download
  loc: SI.B
  page: printed 2 (FDA PDF); FR notice 90 FR 43460-43462
  paraphrase: FDA issued ICH E6(R3) (Principles and Annex 1 with Appendices A-C and Glossary) as final Level 1 guidance for industry in September 2025, finalising the June 2023 draft; Annex 2 remains a separate draft. As FDA guidance it contains nonbinding recommendations. Neither the guidance page, the FR notice nor the PDF front matter states that it supersedes the E6(R2) guidance.
  quote: do not establish legally enforceable responsibilities
  local_text: vendor/sources/FDA-E6R3/doc_30.txt
- id: R4-082
  src: FDA-RBM13
  doc: Oversight of Clinical Investigations - A Risk-Based Approach to Monitoring, Guidance for Industry, August 2013 (final; docket FDA-2011-D-0597)
  url: https://www.fda.gov/media/116754/download
  loc: SIII.B
  page: printed 8
  paraphrase: Centralized monitoring should be used where appropriate; routine review of submitted data can identify missing, inconsistent or outlying data and potential protocol deviations that may indicate systemic or significant errors, and sponsors should analyse site characteristics and performance metrics to find sites associated with poor performance or noncompliance.
  quote: ''
  local_text: vendor/sources/FDA-RBM13/doc_32.txt
- id: R4-083
  src: FDA-RBM13
  doc: Oversight of Clinical Investigations - A Risk-Based Approach to Monitoring, Guidance for Industry, August 2013 (final; docket FDA-2011-D-0597)
  url: https://www.fda.gov/media/116754/download
  loc: SIV.D.1
  page: printed 15
  paraphrase: If an investigator differs markedly from others in metrics such as the number of protocol deviations, the site should be considered for targeted on-site visits; sponsors may set up a mechanism to track deviations affecting data needed to interpret the primary endpoint and to notify key study personnel.
  quote: ''
  local_text: vendor/sources/FDA-RBM13/doc_32.txt
- id: R4-087
  src: FDA-RBM13
  doc: Oversight of Clinical Investigations - A Risk-Based Approach to Monitoring, Guidance for Industry, August 2013 (final; docket FDA-2011-D-0597)
  url: https://www.fda.gov/media/116754/download
  loc: SIV.D.5
  page: printed 17
  paraphrase: Sponsors should consider which events would call for reviewing and revising the monitoring plan, e.g. a protocol amendment, a change in the definition of significant protocol deviations, or newly identified risks to study integrity.
  quote: ''
  local_text: vendor/sources/FDA-RBM13/doc_32.txt
- id: R4-095
  src: FDA-RBM23
  doc: A Risk-Based Approach to Monitoring of Clinical Investigations - Questions and Answers, Guidance for Industry, April 2023 (final; docket FDA-2019-D-0362)
  url: https://www.fda.gov/media/121479/download
  loc: SQ7
  page: printed 9
  paraphrase: Significant issues found through monitoring should be evaluated promptly at the appropriate levels; root-cause analysis and corrective and preventive action should be undertaken promptly, the risk assessment and monitoring plan reviewed and revised, and the protocol amended where corrective actions change processes; example actions are retraining, halting enrolment at a site, clarifying the protocol and changing vendor agreements.
  quote: ''
  local_text: vendor/sources/FDA-RBM23/doc_33.txt
- id: R5-002
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SDefine
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: Important protocol deviations are the subset that may significantly affect the completeness, accuracy or reliability of key study data, or a participant's rights, safety or well-being; examples are enrolling participants who violate key eligibility criteria and failing to collect data needed to interpret primary endpoints. The paper bases this on ICH E3 Q&A (R1) and applies ICH E6(R2) risk-based thinking.
  quote: ''
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-003
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SDefine
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: Because ICH E3 gives no formal definition of non-important deviations, the authors consider it reasonable to treat every deviation that does not meet the important criteria as non-important. Both kinds are collected, processed and reported, although by different pathways.
  quote: ''
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-006
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SDefine
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: Holding periodic reviews per therapeutic area or indication is named a best practice to keep classification of important deviations consistent within a company.
  quote: ''
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-009
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SProtocol
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: Because the protocol and its referenced documents decide what is a deviation, risk assessment reviews and the deviation classification approach should be done before the protocol is finalised, so the protocol can still be changed to prevent deviations.
  quote: conduct risk assessment reviews and define PD classification approaches
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-012
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SPrepare
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: 'The PDAP lists the deviations classed as important. Non-important deviations are described pragmatically: only those often misclassified or tied to a classification threshold are included.'
  quote: the PDAP should describe PDs classified as important
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-013
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SPrepare
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: 'Recommended PDAP content: guidance for consistent classification and categorisation; how potential important deviations will be identified and which main team members are involved; and the thresholds at which non-important deviations may become important.'
  quote: ''
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-019
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: STrain
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: Retraining and feedback mechanisms should also be put in place.
  quote: ''
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-020
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SIdentify-and-Collect
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: Deviations are identified programmatically (computerised processing of database data) or manually (human judgement). A clearly defined PDAP states how potential important deviations will be identified, so that the two channels are aligned and each covers what the other cannot.
  quote: ''
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-022
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SIdentify-and-Collect
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: Risk-based monitoring may miss some deviations but should catch the important ones. Risk assessments point to the critical data and processes, so effort can be focused on deviations with most impact on participant safety and data reliability.
  quote: ''
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-028
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SConfirm
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: Classification and categorisation need confirmation; the review is recommended to be done by an independent study team member or group, not the person who identified the deviation.
  quote: an independent study team member (or group), other than the identifier
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-031
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SConfirm
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: Non-important deviations undergo periodic aggregate review to detect trends or systemic errors that could cross a threshold and justify upgrading them to important.
  quote: periodic aggregate reviews should be completed to identify trends or systemic errors
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-032
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SStore
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: 'Deviations, with their classification, category and linked data points, are stored in a validated repository or system (examples: CTMS, EDC, TMF or a custom system) that allows both important and non-important deviations to be retrieved or regenerated for analysis and reporting.'
  quote: ''
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-034
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SReview-and-Analyze
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: Study teams' periodic reviews, data monitoring and analyses during conduct may be used to find important deviations not yet in the PDAP and to judge whether the frequency or volume of non-important deviations should trigger reclassification; if existing activities cannot serve this, extra effort should be considered.
  quote: ''
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-040
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SReport
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: Summarise the important deviations by category in the CSR.
  quote: ''
  local_text: vendor/sources/TCB-PD-TIRS/doc_34.txt
- id: R5-043
  src: TCB-PD-TIRS
  doc: 'Protocol Deviations: A Holistic Approach from Defining to Reporting. Therapeutic Innovation and Regulatory Science 55(4):733-742, 2021 (TransCelerate working group, CC BY 4.0)'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8238759
  loc: SClose-Out
  page: journal pp. 733-742 (section page not confirmed; PMC HTML read)
  paraphrase: Non-important deviations are archived in a validated repository or system so they remain available for later reviews and for deviation datasets, SDTM being the example given.
  quote: ''
