  page: PDF 1 (cover of EMA/CHMP/ICH/135/1995); web page unpaginated
  paraphrase: ICH E6(R3) principles and Annex 1 were finally adopted by CHMP on 12 December 2024 and came into effect in the EU on 23 July 2025 as an EMA scientific guideline. Its legal effect for trials under the EU CTR runs through Art. 47 (conduct per GCP principles; take appropriate account of ICH GCP).
