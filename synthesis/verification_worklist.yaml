- id: R3-090
  src: CTIS-BT-SB24
  doc: 'CTIS Bitesize Talk: End of transition period and notifications including serious breaches, EMA, 16 October 2024 (presentation)'
  url: https://www.ema.europa.eu/en/documents/presentation/presentation-ctis-bitesize-talk-end-transition-period-notifications-including-serious-breaches_en.pdf
  loc: SSlide-20
  page: slide 20; notification type label on an unnumbered CTCG slide
  paraphrase: For trials authorised in the EU/EEA, a serious breach is reported via CTIS to all Member States concerned regardless of where it occurred; the notification type is 'Serious Breaches, safety relevant (SB)'.
  quote: the SB should be reported via CTIS to all MSC
  local_text: vendor/sources/CTIS-BT-SB24/doc_15.txt
- id: R3-092
  src: CTIS-BT-SB24
  doc: 'CTIS Bitesize Talk: End of transition period and notifications including serious breaches, EMA, 16 October 2024 (presentation)'
  url: https://www.ema.europa.eu/en/documents/presentation/presentation-ctis-bitesize-talk-end-transition-period-notifications-including-serious-breaches_en.pdf
  loc: SSlide-19
  page: slides 19, 26
  paraphrase: The serious breach report can be updated as the investigation progresses, and a fuller CAPA can be provided after full investigation.
  quote: Updates to the SB report can be made
  local_text: vendor/sources/CTIS-BT-SB24/doc_15.txt
- id: R3-093
  src: CTIS-BT-SB24
  doc: 'CTIS Bitesize Talk: End of transition period and notifications including serious breaches, EMA, 16 October 2024 (presentation)'
  url: https://www.ema.europa.eu/en/documents/presentation/presentation-ctis-bitesize-talk-end-transition-period-notifications-including-serious-breaches_en.pdf
  loc: SSlide-29
  page: slides 28-29
  paraphrase: Member States assess the notification (the reporting or a coordinating Member State may lead) and communicate with the sponsor mainly through requests for information (RFI) in CTIS, with a deadline proposed by the most affected or coordinating Member State; the sponsor watches the RFI folder and responds. The legislation sets no assessment timeline.
  quote: Communication with the sponsors regarding the SBs is mainly done through RFIs
  local_text: vendor/sources/CTIS-BT-SB24/doc_15.txt
- id: R3-094
  src: CTIS-BT-SB24
  doc: 'CTIS Bitesize Talk: End of transition period and notifications including serious breaches, EMA, 16 October 2024 (presentation)'
  url: https://www.ema.europa.eu/en/documents/presentation/presentation-ctis-bitesize-talk-end-transition-period-notifications-including-serious-breaches_en.pdf
  loc: SPublication
  page: publication section (slides unnumbered)
  paraphrase: 'Serious breach, USM and unexpected event notifications are published only after the Member State assessment is finalised in CTIS (for Category 1 trials in adults: 30 months after EU/EEA end of trial and MSC assessment). Only sponsor-entered structured data are published, no authority-entered data and no notification documents; a serious breach withdrawn at Member State request is not published.'
  quote: The notification is published only once the Member State assessment is finalized in CTIS
  local_text: vendor/sources/CTIS-BT-SB24/doc_15.txt
- id: R3-096
  src: CTIS-TM17
  doc: 'Supervise a CT - Ad Hoc Assessment: FAQs, CTIS Training Programme Module 17, version 1.3, August 2024 (EMA)'
  url: https://www.ema.europa.eu/system/files/documents/other/cttm17-faqs_en.pdf
  loc: S4.7
  page: printed 13-14
  paraphrase: When finalising, the Member State links the assessment conclusion to the notification or selects 'no Ad-hoc assessment required'; either action publishes the notification details on the CTIS public portal.
  quote: ''
  local_text: vendor/sources/CTIS-TM17/doc_16.txt
- id: R3-098
  src: EUCTR-QA
  doc: Clinical Trials Regulation (EU) No 536/2014 Questions & Answers, EudraLex Volume 10, version 7.4, October 2026 (supersedes 7.3)
  url: https://health.ec.europa.eu/document/download/4ec3992a-ef9b-41f9-8e34-1dd6d0a479ae_en?filename=mp_ctr_qa_rules.pdf
  loc: S11.3
  page: printed 1-2 (chapter 11)
  paraphrase: 'Q&A 11.3 (point 523): the 7-day timeframe of Art. 52(1) starts when the sponsor becomes aware of a potential breach; only confirmed serious breaches are reported, so the sponsor completes its first analysis, confirms seriousness and submits the initial report in CTIS within those 7 days.'
  quote: The 7-day timeframe starts when the sponsor becomes aware of a potential breach.
  local_text: vendor/sources/EUCTR-QA/doc_12.txt
- id: R3-100
  src: EUCTR-QA
  doc: Clinical Trials Regulation (EU) No 536/2014 Questions & Answers, EudraLex Volume 10, version 7.4, October 2026 (supersedes 7.3)
  url: https://health.ec.europa.eu/document/download/4ec3992a-ef9b-41f9-8e34-1dd6d0a479ae_en?filename=mp_ctr_qa_rules.pdf
  loc: S10.9
  page: printed 8-9 (chapter 10)
  paraphrase: 'Q&A 10.9 (points 498-499): urgent safety measures may involve a temporary halt for safety reasons; one notification is sufficient. If the entire trial is halted (recruitment and/or treatment) a temporary halt notification is submitted; if only parts are halted (e.g. arms, groups, subprotocols) it is reported as an urgent safety measure so that the trial status stays ''ongoing'' in CTIS.'
  quote: ''
  local_text: vendor/sources/EUCTR-QA/doc_12.txt
- id: R3-104
  src: EUCTR-QA
  doc: Clinical Trials Regulation (EU) No 536/2014 Questions & Answers, EudraLex Volume 10, version 7.4, October 2026 (supersedes 7.3)
  url: https://health.ec.europa.eu/document/download/4ec3992a-ef9b-41f9-8e34-1dd6d0a479ae_en?filename=mp_ctr_qa_rules.pdf
  loc: S7.27
  page: printed 22 (chapter 7)
  paraphrase: 'Q&A 7.27 (points 365-367): safety notifications are made via CTIS; when submitting a USM, unexpected event, temporary halt or premature end notification, sponsors inform the Member States whether other trials are affected, list their EU CT numbers, state whether the same or similar notification is or will be submitted for them, and provide available documents and proposed risk minimisation measures where possible.'
  quote: ''
  local_text: vendor/sources/EUCTR-QA/doc_12.txt
- id: R3-105
  src: EUCTR-QA
  doc: Clinical Trials Regulation (EU) No 536/2014 Questions & Answers, EudraLex Volume 10, version 7.4, October 2026 (supersedes 7.3)
  url: https://health.ec.europa.eu/document/download/4ec3992a-ef9b-41f9-8e34-1dd6d0a479ae_en?filename=mp_ctr_qa_rules.pdf
  loc: S11.4
  page: printed 2 (chapter 11)
  paraphrase: 'Q&A 11.4 (points 525-527): GCP inspection reports by third-country authorities must be submitted in CTIS for all sites of a trial under the EU CTR (sponsor, CRO, investigator sites), regardless of location or relevance; the full report is submitted in its original language and Member States may request a translation of the report or a summary of key findings.'
  quote: ''
  local_text: vendor/sources/EUCTR-QA/doc_12.txt
- id: R3-106
  src: CTIS-BT-SB24
  doc: 'CTIS Bitesize Talk: End of transition period and notifications including serious breaches, EMA, 16 October 2024 (presentation)'
  url: https://www.ema.europa.eu/en/documents/presentation/presentation-ctis-bitesize-talk-end-transition-period-notifications-including-serious-breaches_en.pdf
  loc: SPublication
  page: publication section, case scenario slide (unnumbered)
  paraphrase: If a Member State assesses that a notified serious breach should not have been submitted as such, it asks the sponsor through an ad hoc assessment RFI to withdraw it; the sponsor should withdraw a submitted serious breach only on such a Member State request, and the withdrawn breach is not published.
  quote: ''
  local_text: vendor/sources/CTIS-BT-SB24/doc_15.txt
- id: R3-107
  src: CTIS-BT-SB24
  doc: 'CTIS Bitesize Talk: End of transition period and notifications including serious breaches, EMA, 16 October 2024 (presentation)'
  url: https://www.ema.europa.eu/en/documents/presentation/presentation-ctis-bitesize-talk-end-transition-period-notifications-including-serious-breaches_en.pdf
  loc: SSlide-33
  page: slide 33
  paraphrase: Whether an incident qualifies as a serious breach depends on trial and incident factors and is judged case by case; reporting incidents that are not real serious breaches burdens assessors and should be avoided.
  quote: Over-reporting to be avoided!
  local_text: vendor/sources/CTIS-BT-SB24/doc_15.txt
