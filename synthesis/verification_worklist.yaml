  page: printed 4-5 (chapter 1; page numbers restart per chapter)
  paraphrase: 'Q&A 1.5: all submissions for a trial, including site information, are made by or on behalf of the sponsor, not the investigator, via CTIS or EudraVigilance. Investigators therefore do not notify authorities directly under the EU CTR.'
