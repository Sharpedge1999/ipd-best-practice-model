  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S5.1
  page: printed 8/21
  paraphrase: 'An important deviation as defined by ICH E3 (Q&A R1) is not equivalent to a serious breach: one does not imply the other, and not every important deviation needs to be reported through CTIS as a serious breach. Two separate classification decisions are needed.'
  quote: an important deviation is not necessarily also a serious breach and vice versa
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-063
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S5.1
  page: printed 8/21
  paraphrase: All serious breaches should be included in the corresponding clinical study report.
  quote: all serious breaches should be included in the corresponding clinical study report
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-065
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S5.1
  page: printed 8/21
  paraphrase: Deviations that do not significantly affect participant safety or rights or data reliability should still be documented, for example in the case report form or the clinical trial master file, so that corrective and preventive actions can be taken.
  quote: ''
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-066
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S6.1
  page: printed 9/21
  paraphrase: 'The sponsor should have a formal process covering serious breach notification: suspected serious breaches are promptly reported to it by investigators and service providers, and management of serious breaches is part of the sponsor''s quality system as a specific SOP and/or written in the protocol. Lack of an adequate system or failure to report may result in GCP inspection findings.'
  quote: There should be a formal process in place
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-067
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S6.1
  page: printed 9/21
  paraphrase: After receipt, the sponsor assesses whether the breach is serious (deviations/violations, isolated or systematic incidents, participants harmed or put at risk, data credibility) and investigates it, including a root cause analysis that may still be ongoing at the time of reporting.
  quote: a root cause analysis
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-068
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S6.1
  page: printed 9/21
  paraphrase: Corrective and preventive actions should be identified as part of the sponsor's serious breach process.
  quote: corrective and preventive actions should be identified
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-069
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S6.2
  page: printed 9/21
  paraphrase: A delegated party carries out the sponsor tasks of S6.1 under written contract and keeps the sponsor informed about the management of all breaches in the sponsor's trials.
  quote: keeps the sponsor informed about the management of all the breaches
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-070
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S6.3
  page: printed 9/21
  paraphrase: Service providers should have a written process to identify suspected serious breaches and promptly communicate them to the sponsor or delegated party, using the contact details provided and per contract.
  quote: should have a written process in place to identify
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-071
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S6.4
  page: printed 9-10/21
  paraphrase: The principal investigator should have a process (formal SOP or study-specific guidance) ensuring that site staff and service providers delegated by the PI/institution can identify suspected serious breaches and that these are promptly reported to the sponsor or delegated party through the contacts provided.
  quote: a (suspected) serious breach is promptly reported to the sponsor or delegated party
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-072
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S7
  page: printed 10/21
  paraphrase: All concerns about potential fraud in clinical trials that the sponsor becomes aware of are expected to be reported as serious breaches; national criminal law applies in addition.
  quote: all concerns about potential cases of fraud in clinical trials
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-073
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S7
  page: printed 10/21
  paraphrase: The party where the breach occurred should verify its impact on other ongoing or ended clinical trials it is involved in.
  quote: should verify the impact of the breach on other clinical trials
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-075
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S7
  page: printed 10/21
  paraphrase: Persistent or systematic non-compliance with the Regulation, including deviation from GCP principles or the protocol as described in Art. 47, constitutes a serious breach when it is likely to significantly affect the safety and rights of a participant in the EU/EEA or the reliability and robustness of the trial data. Recurring or trended deviations can therefore escalate to a serious breach.
  quote: is likely to significantly affect the safety and rights of a trial participant
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-076
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S7
  page: printed 10/21
  paraphrase: A serious breach at a single site, inside or outside the EU/EEA, should also be notified where it leads to removal of data from the trial analysis.
  quote: this leads to the removal of data from the trial analysis
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-077
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S8
  page: printed 10/21
  paraphrase: Member States assess notified serious breaches in the CTIS secure module; the assessment leads to publication of the breach and its evaluation in the CTIS public domain. Some breaches are managed in-house through acceptable CAPA under Member State oversight; others may trigger an (urgent) inspection, published together with the inspection report, or regulatory action.
  quote: managed in-house via acceptable Corrective and Preventive Actions
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-078
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: S8
  page: printed 10-11/21
  paraphrase: Before imposing corrective measures under EU CTR Art. 77 (e.g. suspension or revocation), the MSC asks the sponsor for an opinion, due within 7 days, except where immediate action is required.
  quote: the MSC will ask the sponsor for their opinion
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-080
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: SAppI-8.4
  page: printed 15/21
  paraphrase: 'Example judged not a serious breach: a common, minor visit date deviation is a minor protocol deviation that does not meet the notification criteria; a major visit date deviation (8.3) can be serious depending on its safety or data impact.'
  quote: a minor protocol deviation, which does not meet the criteria for notification
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-083
  src: EMA-SB
  doc: Guideline for the notification of serious breaches of Regulation (EU) No 536/2014 or the clinical trial protocol, EMA/698382/2021, document date 30 June 2023, effective 31 January 2022
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-notification-serious-breaches-regulation-eu-no-5362014-or-clinical-trial-protocol_en.pdf
  loc: SAppII
  page: printed 18/21
  paraphrase: Where subject safety or rights were compromised, the sponsor should take proportionate actions, which may include informing the affected subjects.
  quote: ''
  local_text: vendor/sources/EMA-SB/doc_11.txt
- id: R3-085
  src: EUCTR-QA
  doc: Clinical Trials Regulation (EU) No 536/2014 Questions & Answers, EudraLex Volume 10, version 7.4, October 2026 (supersedes 7.3)
  url: https://health.ec.europa.eu/document/download/4ec3992a-ef9b-41f9-8e34-1dd6d0a479ae_en?filename=mp_ctr_qa_rules.pdf
