  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.30 Protocol amendments (eCFR, up to date as of 10/22/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-B/section-312.30
  loc: 21CFR312.30(b)(2)(i)
  page: n/a - eCFR web text without pagination
  paraphrase: 'A protocol change covered by 312.30(b)(1) may be put into effect only once two conditions are met, in either order: the change has been submitted to FDA for review and the IRB responsible for the study has approved it.'
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-004
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.30 Protocol amendments (eCFR, up to date as of 10/22/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-B/section-312.30
  loc: 21CFR312.30(b)(2)(ii)
  page: n/a - eCFR web text without pagination
  paraphrase: As an exception to (b)(2)(i), a protocol change intended to eliminate an apparent immediate hazard to subjects may be implemented at once, without waiting for FDA submission or IRB approval. The paragraph is passive; 312.30 as a whole is addressed to the IND sponsor.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-005
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.30 Protocol amendments (eCFR, up to date as of 10/22/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-B/section-312.30
  loc: 21CFR312.30(b)(2)(ii)
  page: n/a - eCFR web text without pagination
  paraphrase: The immediate-hazard exception applies provided FDA is notified afterwards by a protocol amendment and the reviewing IRB is notified in accordance with 21 CFR 56.104(c). No period is stated for the FDA amendment; 56.104(c) itself sets a 5-working-day reporting window for emergency use of a test article.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-006
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.30 Protocol amendments (eCFR, up to date as of 10/22/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-B/section-312.30
  loc: 21CFR312.30(e)
  page: n/a - eCFR web text without pagination
  paraphrase: A protocol amendment for a new protocol or for a change in protocol has to be submitted before it is implemented.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-007
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.50 General responsibilities of sponsors (eCFR, up to date as of 10/08/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.50
  loc: 21CFR312.50
  page: n/a - eCFR web text without pagination
  paraphrase: Sponsors are responsible for ensuring proper monitoring of the investigation(s). Section 312.50 is a single unnumbered paragraph.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-008
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.50 General responsibilities of sponsors (eCFR, up to date as of 10/08/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.50
  loc: 21CFR312.50
  page: n/a - eCFR web text without pagination
  paraphrase: Sponsors are responsible for ensuring that each investigation is conducted in accordance with the general investigational plan and the protocols contained in the IND - the regulatory anchor for sponsor oversight of protocol compliance (FDA-PD24 SIII.B.2 lines 220-222 restates this).
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-009
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.50 General responsibilities of sponsors (eCFR, up to date as of 10/08/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.50
  loc: 21CFR312.50
  page: n/a - eCFR web text without pagination
  paraphrase: Sponsors are responsible for ensuring that FDA and all participating investigators are promptly informed of significant new adverse effects or risks with respect to the drug.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-010
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.53 Selecting investigators and monitors (eCFR, up to date as of 10/23/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.53
  loc: 21CFR312.53(c)(1)(vi)(a)
  page: n/a - eCFR web text without pagination
  paraphrase: In the signed investigator statement (Form FDA-1572) the investigator commits to conduct the study according to the relevant current protocol and to make protocol changes only after notifying the sponsor, except where needed to protect the safety, rights or welfare of subjects. This is the binding US basis for investigator-to-sponsor communication on changes; 312.56(b) makes noncompliance with this agreement a sponsor trigger.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-011
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.53 Selecting investigators and monitors (eCFR, up to date as of 10/23/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.53
  loc: 21CFR312.53(c)(1)(vii)
  page: n/a - eCFR web text without pagination
  paraphrase: For studies subject to Part 56, the investigator commits in Form FDA-1572 that a Part 56 IRB will handle initial and continuing review, that all changes in the research activity and all unanticipated problems involving risks are promptly reported to the IRB, and that no changes are made without IRB approval except to eliminate apparent immediate hazards. Mirrors 312.66.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-012
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.56 Review of ongoing investigations (eCFR, up to date as of 10/19/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.56
  loc: 21CFR312.56(a)
  page: n/a - eCFR web text without pagination
  paraphrase: The sponsor has to monitor the progress of all clinical investigations conducted under its IND.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-013
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.56 Review of ongoing investigations (eCFR, up to date as of 10/19/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.56
  loc: 21CFR312.56(b)
  page: n/a - eCFR web text without pagination
  paraphrase: A sponsor that discovers an investigator is not complying with the signed agreement (Form FDA-1572), the general investigational plan, or Part 312 or other applicable parts has to promptly either secure compliance or stop drug shipments to that investigator and end the investigator's participation.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-014
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.56 Review of ongoing investigations (eCFR, up to date as of 10/19/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.56
  loc: 21CFR312.56(b)
  page: n/a - eCFR web text without pagination
  paraphrase: If an investigator's participation is ended for noncompliance, the sponsor has to require the investigator to dispose of or return the investigational drug under 312.59 and has to notify FDA.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-015
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.56 Review of ongoing investigations (eCFR, up to date as of 10/19/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.56
  loc: 21CFR312.56(c)
  page: n/a - eCFR web text without pagination
  paraphrase: The sponsor has to review and evaluate the evidence on safety and effectiveness as it is obtained from investigators, report safety information to FDA under 312.32 and submit annual reports under 312.33. 312.32 and 312.33 were not extracted in this stem.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-016
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.56 Review of ongoing investigations (eCFR, up to date as of 10/19/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.56
  loc: 21CFR312.56(d)
  page: n/a - eCFR web text without pagination
  paraphrase: If the sponsor determines that the investigational drug presents an unreasonable and significant risk to subjects, it has to discontinue the investigations presenting that risk, notify FDA, all IRBs and all investigators who ever participated, assure disposition of outstanding drug stocks under 312.59 and give FDA a full report of its actions. Boundary event for the iPD process when deviations reveal such a risk.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-017
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.60 General responsibilities of investigators (eCFR, up to date as of 10/23/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.60
  loc: 21CFR312.60
  page: n/a - eCFR web text without pagination
  paraphrase: The investigator is responsible for ensuring that the investigation is conducted according to the signed investigator statement, the investigational plan and applicable regulations. Section 312.60 is a single unnumbered paragraph.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-018
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.60 General responsibilities of investigators (eCFR, up to date as of 10/23/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.60
  loc: 21CFR312.60
  page: n/a - eCFR web text without pagination
  paraphrase: The investigator is responsible for protecting the rights, safety and welfare of subjects under the investigator's care and for control of the drugs under investigation. FDA-PD24 SIII.B.1 (lines 190-194) notes that failing to follow protocol elements designed to protect subjects may be considered a failure of this duty.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-019
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.60 General responsibilities of investigators (eCFR, up to date as of 10/23/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.60
  loc: 21CFR312.60
  page: n/a - eCFR web text without pagination
  paraphrase: The investigator has to obtain the informed consent of each human subject to whom the drug is administered, in accordance with Part 50. Basis for consent-related deviations (FDA-PD24 lists failure to obtain consent as an important deviation).
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-020
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.62 Investigator recordkeeping and record retention (eCFR, up to date as of 10/21/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.62
  loc: 21CFR312.62(b)
  page: n/a - eCFR web text without pagination
  paraphrase: The investigator has to prepare and maintain adequate and accurate case histories recording all observations and other relevant data for each subject given the drug or used as a control, including case report forms and supporting data such as signed and dated consent forms and medical records; the case history has to document that consent was obtained before participation. This is the binding source-record basis on which deviations are identified and documented at site.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-021
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.62 Investigator recordkeeping and record retention (eCFR, up to date as of 10/21/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.62
  loc: 21CFR312.62(c)
  page: n/a - eCFR web text without pagination
  paraphrase: The investigator has to retain the required records for 2 years after a marketing application is approved for the indication investigated, or, if no application is filed or it is not approved for that indication, for 2 years after the investigation is discontinued and FDA is notified.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-022
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.66 Assurance of IRB review (eCFR, up to date as of 10/21/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.66
  loc: 21CFR312.66
  page: n/a - eCFR web text without pagination
  paraphrase: The investigator has to assure that an IRB complying with Part 56 will be responsible for initial and continuing review and approval of the proposed study. Section 312.66 is a single unnumbered paragraph.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-023
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.66 Assurance of IRB review (eCFR, up to date as of 10/21/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.66
  loc: 21CFR312.66
  page: n/a - eCFR web text without pagination
  paraphrase: The investigator has to assure that he or she will promptly report to the IRB all changes in the research activity and all unanticipated problems involving risks to human subjects or others.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-024
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.66 Assurance of IRB review (eCFR, up to date as of 10/21/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-D/section-312.66
  loc: 21CFR312.66
  page: n/a - eCFR web text without pagination
  paraphrase: The investigator will not make any change in the research without IRB approval, except where necessary to eliminate apparent immediate hazards to human subjects. FDA-PD24 applies this to intentional single-participant deviations (prior IRB approval required).
  quote: except where necessary to eliminate apparent immediate hazards to human subjects
  local_text: vendor/sources/eCFR-api/part312.txt
- id: R4-025
  src: 21CFR56
  doc: 21 CFR Part 56 - Institutional Review Boards, section 56.108 IRB functions and operations (eCFR, up to date as of 10/20/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-56/subpart-C/section-56.108
  loc: 21CFR56.108(a)(3)
  page: n/a - eCFR web text without pagination
  paraphrase: Each IRB has to follow written procedures for ensuring prompt reporting to the IRB of changes in research activity. The text does not name the reporting party; 312.66 places the reporting duty on the investigator.
  quote: ''
  local_text: vendor/sources/eCFR-api/part56.txt
- id: R4-026
  src: 21CFR56
  doc: 21 CFR Part 56 - Institutional Review Boards, section 56.108 IRB functions and operations (eCFR, up to date as of 10/20/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-56/subpart-C/section-56.108
  loc: 21CFR56.108(a)(4)
  page: n/a - eCFR web text without pagination
  paraphrase: Each IRB has to follow written procedures ensuring that changes in approved research, during the period of approval, are not initiated without IRB review and approval, except where necessary to eliminate apparent immediate hazards to the subjects.
  quote: ''
  local_text: vendor/sources/eCFR-api/part56.txt
- id: R4-027
  src: 21CFR56
  doc: 21 CFR Part 56 - Institutional Review Boards, section 56.108 IRB functions and operations (eCFR, up to date as of 10/20/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-56/subpart-C/section-56.108
  loc: 21CFR56.108(b)(1)
  page: n/a - eCFR web text without pagination
  paraphrase: Each IRB has to follow written procedures for ensuring prompt reporting to the IRB, appropriate institutional officials and FDA of any unanticipated problems involving risks to human subjects or others. The text does not name the reporting party.
  quote: ''
  local_text: vendor/sources/eCFR-api/part56.txt
- id: R4-028
  src: 21CFR56
  doc: 21 CFR Part 56 - Institutional Review Boards, section 56.108 IRB functions and operations (eCFR, up to date as of 10/20/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-56/subpart-C/section-56.108
  loc: 21CFR56.108(b)(2)
  page: n/a - eCFR web text without pagination
  paraphrase: Each IRB has to follow written procedures for ensuring prompt reporting to the IRB, appropriate institutional officials and FDA of any instance of serious or continuing noncompliance with the FDA regulations or with the IRB's requirements or determinations.
  quote: serious or continuing noncompliance
  local_text: vendor/sources/eCFR-api/part56.txt
- id: R4-029
  src: 21CFR56
  doc: 21 CFR Part 56 - Institutional Review Boards, section 56.108 IRB functions and operations (eCFR, up to date as of 10/20/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-56/subpart-C/section-56.108
  loc: 21CFR56.108(b)(3)
  page: n/a - eCFR web text without pagination
  paraphrase: Each IRB has to follow written procedures for ensuring prompt reporting to the IRB, appropriate institutional officials and FDA of any suspension or termination of IRB approval.
  quote: ''
  local_text: vendor/sources/eCFR-api/part56.txt
- id: R4-030
  src: 21CFR56
  doc: 21 CFR Part 56 - Institutional Review Boards, section 56.104 Exemptions from IRB requirement (Cornell LII rendering of current CFR, read 2026-11-06)
  url: https://www.law.cornell.edu/cfr/text/21/56.104
  loc: 21CFR56.104(c)
  page: n/a - web text without pagination
  paraphrase: Emergency use of a test article is exempt from prior IRB review provided the emergency use is reported to the IRB within 5 working days; any later use of the test article at the institution is subject to IRB review. Relevant here only because 21CFR312.30(b)(2)(ii) cross-refers to it for IRB notification of immediate-hazard protocol changes.
  quote: reported to the IRB within 5 working days
  local_text: vendor/sources/eCFR-api/part56.txt
- id: R4-031
  src: 21CFR50
  doc: 21 CFR Part 50 - Protection of Human Subjects, section 50.20 General requirements for informed consent (eCFR, up to date as of 10/22/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-50/subpart-B/section-50.20
  loc: 21CFR50.20
  page: n/a - eCFR web text without pagination
  paraphrase: Except as provided in 50.22, 50.23 and 50.24, no investigator may involve a human being as a subject in covered research unless legally effective informed consent of the subject or the legally authorized representative has been obtained. Used here only as the binding basis for consent-related deviations.
  quote: ''
  local_text: vendor/sources/eCFR-api/part50.txt
- id: R4-032
  src: 21CFR50
  doc: 21 CFR Part 50 - Protection of Human Subjects, section 50.20 General requirements for informed consent (eCFR, up to date as of 10/22/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-50/subpart-B/section-50.20
  loc: 21CFR50.20
  page: n/a - eCFR web text without pagination
  paraphrase: The investigator has to seek consent only under circumstances that give the prospective subject or representative sufficient opportunity to decide and that minimize the possibility of coercion or undue influence, and the information has to be in language understandable to them. Basis for consent-process deviations.
  quote: ''
  local_text: vendor/sources/eCFR-api/part50.txt
- id: R4-033
  src: 21CFR50
  doc: 21 CFR Part 50 - Protection of Human Subjects, section 50.27 Documentation of informed consent (eCFR, up to date as of 10/19/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-50/subpart-B/section-50.27
  loc: 21CFR50.27(a)
  page: n/a - eCFR web text without pagination
  paraphrase: Except as provided in 56.109(c), informed consent has to be documented by a written consent form approved by the IRB, signed and dated by the subject or legally authorized representative at the time of consent, with a copy given to the signer. The obliged party is not named in 50.27; 312.60 places the consent duty on the investigator. A missing signature or date is a consent-documentation deviation; FDA-PD24 SIII.A.2 treats a missing initial as a non-important example.
  quote: ''
  local_text: vendor/sources/eCFR-api/part50.txt
- id: R4-034
  src: 21CFR50
  doc: 21 CFR Part 50 - Protection of Human Subjects, section 50.27 Documentation of informed consent (eCFR, up to date as of 10/19/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-50/subpart-B/section-50.27
  loc: 21CFR50.27(b)
  page: n/a - eCFR web text without pagination
  paraphrase: The consent form may be either (1) a written document with all 50.25 elements, which may be read to the subject but must be available for reading before signature, or (2) a short form stating the elements were presented orally, with a witness present, an IRB-approved written summary, the short form signed by the subject or representative, the witness signing short form and summary, the person obtaining consent signing the summary, and copies of both given to the subject or representative.
  quote: ''
  local_text: vendor/sources/eCFR-api/part50.txt
- id: R4-035
  src: FDA-PD24
  doc: Protocol Deviations for Clinical Investigations of Drugs, Biological Products, and Devices - Draft Guidance for Industry, December 2024 (CDER, CBER, CDRH, OCE; docket FDA-2023-D-5016)
  url: https://www.fda.gov/media/184745/download
  loc: SII
  page: printed 1-2; lines 17-19 and 57-63
  paraphrase: 'FDA notes that its regulations neither define protocol deviation nor classify deviation types (SI lines 17-19), and adopts the ICH E3(R1) Q&A definition: a protocol deviation is any change, divergence or departure from the study design or procedures defined in the protocol.'
  quote: any change, divergence, or departure from the study design or procedures
  local_text: vendor/sources/FDA-PD24/doc_29.txt
- id: R4-036
  src: FDA-PD24
  doc: Protocol Deviations for Clinical Investigations of Drugs, Biological Products, and Devices - Draft Guidance for Industry, December 2024 (CDER, CBER, CDRH, OCE; docket FDA-2023-D-5016)
  url: https://www.fda.gov/media/184745/download
  loc: SII
  page: printed 2; line 60 (restated in SIII.A.1, printed 4)
  paraphrase: An important protocol deviation is the subset of protocol deviations that might significantly affect the completeness, accuracy or reliability of study data, or a subject's rights, safety or well-being (adopted from ICH E3(R1)).
  quote: a subset of protocol deviations that might significantly affect the completeness
  local_text: vendor/sources/FDA-PD24/doc_29.txt
- id: R4-041
  src: FDA-PD24
  doc: Protocol Deviations for Clinical Investigations of Drugs, Biological Products, and Devices - Draft Guidance for Industry, December 2024 (CDER, CBER, CDRH, OCE; docket FDA-2023-D-5016)
  url: https://www.fda.gov/media/184745/download
  loc: SIII.A.1
  page: printed 4; lines 121-122
  paraphrase: FDA recommends using the single term 'important' for deviations otherwise labelled major, critical or significant.
  quote: ''
  local_text: vendor/sources/FDA-PD24/doc_29.txt
- id: R4-043
  src: FDA-PD24
  doc: Protocol Deviations for Clinical Investigations of Drugs, Biological Products, and Devices - Draft Guidance for Industry, December 2024 (CDER, CBER, CDRH, OCE; docket FDA-2023-D-5016)
  url: https://www.fda.gov/media/184745/download
  loc: SIII.A.1
  page: printed 4; lines 136-137
  paraphrase: It may be helpful for the protocol to define important protocol deviations and to give study-specific examples.
  quote: ''
  local_text: vendor/sources/FDA-PD24/doc_29.txt
- id: R4-044
  src: FDA-PD24
  doc: Protocol Deviations for Clinical Investigations of Drugs, Biological Products, and Devices - Draft Guidance for Industry, December 2024 (CDER, CBER, CDRH, OCE; docket FDA-2023-D-5016)
  url: https://www.fda.gov/media/184745/download
  loc: SIII.A.1
  page: printed 4-5; lines 139-161
  paraphrase: 'Non-exhaustive list of deviations FDA considers important because they affect subject protection or safety assessment: failure to perform safety assessments or adequately monitor participants (e.g. missing important safety labs, product not administered as specified); prohibited concomitant treatment raising risk; failure to obtain informed consent or meet Part 50; failure to protect identifiable private health information; failure to withdraw product when withdrawal criteria are met; wrong treatment, incorrect dose or wrong device; failure to follow the randomization scheme.'
  quote: ''
  local_text: vendor/sources/FDA-PD24/doc_29.txt
- id: R4-051
  src: FDA-PD24
