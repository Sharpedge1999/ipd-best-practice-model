- id: R4-002
  src: 21CFR312
  doc: 21 CFR Part 312 - Investigational New Drug Application, section 312.30 Protocol amendments (eCFR, up to date as of 10/22/2026)
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-B/section-312.30
  loc: 21CFR312.30(b)(1)
  page: n/a - eCFR web text without pagination
  paraphrase: The sponsor has to submit a protocol amendment describing any change to a Phase 1 protocol that significantly affects subject safety, or to a Phase 2 or 3 protocol that significantly affects subject safety, the scope of the investigation or the scientific quality of the study. Listed examples are dose or exposure increases beyond the current protocol, significant increases in subject numbers, significant design changes such as adding or dropping a control group, and adding or removing a safety-monitoring test.
  quote: ''
  local_text: vendor/sources/eCFR-api/part312.txt
