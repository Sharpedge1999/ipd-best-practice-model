items:
- id: R1-001
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: P3.1
  page: printed 4 / PDF 12
  paraphrase: A trial should be conducted in compliance with the protocol that has received prior IRB/IEC approval or favourable opinion.
  quote: A trial should be conducted in compliance with the protocol
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-002
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: P6.2
  page: printed 5 / PDF 13
  paraphrase: Factors critical to the quality of the trial should be identified prospectively; quality by design means focusing on these critical to quality factors so the trial is likely to meet its objectives.
  quote: Factors critical to the quality of the trial should be identified prospectively.
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-003
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: P6.3
  page: printed 5 / PDF 13
  paraphrase: Strategies should be implemented to avoid, detect, address and prevent recurrence of serious noncompliance with GCP, the trial protocol and applicable regulatory requirements.
  quote: avoid, detect, address and prevent recurrence of serious noncompliance
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-004
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: P7.1
  page: printed 5 / PDF 13
  paraphrase: Trial processes should be proportionate to the risks inherent in the trial and to the importance of the information collected; risks cover participant rights, safety and well-being and the reliability of results.
  quote: Trial processes should be proportionate to the risks inherent in the trial
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-005
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: P7.3
  page: printed 5 / PDF 13
  paraphrase: Risks to critical to quality factors should be managed proactively and adjusted when new or unanticipated issues arise once the trial has begun.
  quote: Risks to critical to quality factors should be managed proactively
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-006
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: P7.4
  page: printed 5-6 / PDF 13-14
  paraphrase: Trial processes should be operationally feasible and avoid unnecessary complexity, procedures and data collection; the sponsor should not place unnecessary burden on participants and investigators.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-007
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: P8.3
  page: printed 6 / PDF 14
  paraphrase: The clinical trial protocol and the plans or documents for protocol execution (e.g. statistical analysis plan, data management plan, monitoring plan) should be clear, concise and operationally feasible.
  quote: should be clear, concise and operationally feasible
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-008
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: P9.5
  page: printed 6 / PDF 14
  paraphrase: Essential records should be retained securely by sponsors and investigators for the required period per applicable regulatory requirements and be available on request to regulatory authorities, monitors, auditors and IRBs/IECs (as appropriate).
  quote: Essential records should be retained securely by sponsors and investigators
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-009
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: P10.1
  page: printed 7 / PDF 15
  paraphrase: The sponsor may transfer, or the investigator may delegate, their activities, but they retain overall responsibility for their respective activities.
  quote: they retain overall responsibility for their respective activities
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-010
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: P10.3
  page: printed 7 / PDF 15
  paraphrase: Sponsors or investigators should maintain appropriate oversight of the activities they delegate or transfer.
  quote: should maintain appropriate oversight of the aforementioned activities
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-011
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-1.4.7
  page: printed 10 / PDF 18
  paraphrase: The IRB/IEC's written procedures should specify that no deviation from or change to the protocol is initiated without prior documented IRB/IEC approval/favourable opinion of an appropriate amendment, except where necessary to eliminate immediate hazards to participants or where the change involves only logistical or administrative aspects, in accordance with applicable regulatory requirements.
  quote: no deviations from or changes to the protocol should be initiated
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-012
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-1.4.8(a)
  page: printed 10-11 / PDF 18-19
  paraphrase: The IRB/IEC's procedures should specify that the investigator/institution promptly reports to the IRB/IEC deviations from the protocol made to eliminate immediate hazards to trial participants (cross-references to 1.4.7, 2.5.4 and 2.5.5).
  quote: Deviations from the protocol to eliminate immediate hazards to the trial participants
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-013
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-1.4.8(b)
  page: printed 11 / PDF 19
  paraphrase: The IRB/IEC's procedures should specify that the investigator/institution promptly reports changes that increase the risk to participants and/or significantly affect the conduct of the trial (cross-reference to 2.4.6).
  quote: Changes increasing the risk to participants and/or significantly affecting the conduct of the trial
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-014
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-1.4.9
  page: printed 11 / PDF 19
  paraphrase: The IRB/IEC's procedures should include ensuring that the IRB/IEC promptly notifies the investigator/institution or sponsor in writing (paper or electronic) of its trial-related decisions/opinions, the reasons for them and the procedures for appeal.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-015
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.3.1
  page: printed 12 / PDF 20
  paraphrase: The investigator retains ultimate responsibility and should maintain appropriate oversight of persons or parties undertaking delegated activities; the level of oversight should depend on the nature of the delegated activities and be proportionate to the importance of the data and the risks to participant safety and data reliability.
  quote: The investigator retains the ultimate responsibility
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-016
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.4.6
  page: printed 13 / PDF 21
  paraphrase: The investigator or sponsor should promptly inform the IRB/IEC (see 1.4.8) and, where applicable, the institution of changes that significantly affect the conduct of the trial or increase the risk to participants.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-017
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.5.2
  page: printed 13 / PDF 21
  paraphrase: The investigator should comply with the protocol, GCP and applicable regulatory requirements.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-018
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.5.3
  page: printed 13 / PDF 21
  paraphrase: The investigator should document all protocol deviations.
  quote: document all protocol deviations
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-019
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.5.3
  page: printed 13 / PDF 21
  paraphrase: In addition to deviations identified by the investigator, protocol deviations relevant to the investigator's participants and their conduct of the trial may be communicated by the sponsor (cross-reference to 3.11.4.5.1(b)).
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-020
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.5.3
  page: printed 13 / PDF 21
  paraphrase: In either case (investigator-identified or sponsor-communicated), the investigator should review the deviations and, for those deemed important, explain the deviation (cross-reference to 3.9.3).
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-021
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.5.3
  page: printed 13 / PDF 21
  paraphrase: For important deviations the investigator should implement appropriate measures to prevent recurrence, where applicable.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-022
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.5.4
  page: printed 13 / PDF 21
  paraphrase: The investigator should follow the protocol and deviate only where necessary to eliminate an immediate hazard to trial participants.
  quote: deviate only where necessary to eliminate an immediate hazard(s)
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-023
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.5.4
  page: printed 13 / PDF 21
  paraphrase: In case of a deviation undertaken to eliminate an immediate hazard, the investigator should inform the sponsor promptly.
  quote: inform the sponsor promptly
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-024
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.5.5
  page: printed 13 / PDF 21
  paraphrase: In the case of an immediate hazard, the investigator should report information on the immediate hazard, the implemented change and any subsequent proposed protocol amendment to the IRB/IEC and, where applicable, to regulatory authorities.
  quote: report information on the immediate hazard
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-025
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.12.2
  page: printed 21 / PDF 29
  paraphrase: Source records should be attributable, legible, contemporaneous, original, accurate and complete; changes to source records should be traceable and explained if necessary.
  quote: Source records should be attributable, legible, contemporaneous, original, accurate and complete.
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-026
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.12.6
  page: printed 22 / PDF 30
  paraphrase: Data reported to the sponsor should be consistent with source records or discrepancies explained; changes or corrections to reported data should be traceable and should not obscure the original entry.
  quote: Changes or corrections in the reported data should be traceable
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-027
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.12.11
  page: printed 22 / PDF 30
  paraphrase: Trial records should be maintained as specified in Appendix C and applicable regulatory requirements; the investigator/institution should have control of all essential records it generates.
  quote: should have control of all essential records generated
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-028
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.12.12
  page: printed 23 / PDF 31
  paraphrase: The investigator/institution should retain essential records for the retention period required by applicable regulatory requirements or until the sponsor informs them they are no longer needed, whichever is the longest, and take measures to ensure availability, accessibility and readability and to prevent unauthorised access and premature destruction (see Appendix C).
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-029
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.12.14
  page: printed 23 / PDF 31
  paraphrase: On request of the monitor, auditor, IRB/IEC or regulatory authority, the investigator/institution should make all requested trial-related records available for direct access.
  quote: should make available for direct access all requested
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-030
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.1.2
  page: printed 23 / PDF 31
  paraphrase: In building quality into trial design, the sponsor should identify factors critical to the quality of the trial and manage risks to those factors.
  quote: factors that are critical to the quality of the trial
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-031
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.9.2
  page: printed 26 / PDF 34
  paraphrase: The sponsor should ensure that trial processes are conducted in compliance with the protocol and related documents, applicable regulatory requirements and ethical standards.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-032
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.9.3
  page: printed 27 / PDF 35
  paraphrase: The sponsor should determine the necessary trial-specific criteria for classifying protocol deviations as important.
  quote: The sponsor should determine necessary trial-specific criteria for classifying protocol deviations as important.
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-033
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.9.3
  page: printed 27 / PDF 35
  paraphrase: Important protocol deviations are a subset of protocol deviations that may significantly affect the completeness, accuracy and/or reliability of trial data or significantly affect a participant's rights, safety or well-being.
  quote: Important protocol deviations are a subset of protocol deviations
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-034
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.9.5
  page: printed 27 / PDF 35
  paraphrase: The range and extent of oversight measures should be fit for purpose and tailored to trial complexity and risks; selection and oversight of investigators and service providers are fundamental features, and oversight includes QA and QC of their trial-related activities.
  quote: The range and extent of oversight measures should be fit for purpose
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-035
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.9.6
  page: printed 27 / PDF 35
  paraphrase: The sponsor should ensure appropriate and timely escalation and follow-up of issues so that appropriate actions can be taken.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-036
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.10
  page: printed 27 / PDF 35
  paraphrase: The sponsor should implement a system to manage quality throughout all stages of the trial, using a proportionate, risk-based approach that builds quality into design and identifies factors likely to have a meaningful impact on participant protection and reliability of results, i.e. critical to quality factors as described in ICH E8(R1).
  quote: critical to quality factors as described in ICH E8(R1)
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-037
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.10
  page: printed 27 / PDF 35
  paraphrase: The sponsor should describe the quality management approach implemented in the trial in the clinical trial report (see ICH E3).
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-038
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.10.1.1
  page: printed 28 / PDF 36
  paraphrase: The sponsor should identify risks that may have a meaningful impact on critical to quality factors, prior to trial initiation and throughout conduct, considering processes and systems including computerised systems (e.g. trial design, participant selection, informed consent, randomisation, blinding, investigational product administration, data handling, service provider activities).
  quote: identify risks that may have a meaningful impact on critical to quality factors
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-039
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.10.1.2
  page: printed 28 / PDF 36
  paraphrase: The sponsor should evaluate identified risks and existing controls by considering the likelihood of harm/hazard occurring, the extent to which it would be detectable and its impact on participant protection and reliability of trial results.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-040
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.10.1.3
  page: printed 28 / PDF 36
  paraphrase: Risk control should be proportionate to the importance of the risk to participants' rights, safety and well-being and the reliability of trial results; risk mitigation may be incorporated e.g. in protocol design and implementation, monitoring plans, agreements defining roles and responsibilities, and training.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-041
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.10.1.3
  page: printed 28 / PDF 36
  paraphrase: Where relevant, the sponsor should set pre-specified acceptable ranges (e.g. quality tolerance limits at the trial level) to support the control of risks to critical to quality factors; the ranges reflect limits that, when exceeded, may impact participant safety or reliability of results.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-042
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.10.1.3
  page: printed 28 / PDF 36
  paraphrase: Where deviation beyond the pre-specified acceptable ranges is detected, an evaluation should be performed to determine whether there is a possible systemic issue and whether action is needed.
  quote: an evaluation should be performed to determine if there is a possible systemic issue
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-043
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.10.1.4
  page: printed 28 / PDF 36
  paraphrase: The sponsor should document identified risks and mitigating activities and communicate them to those who are involved in taking action or are affected; communication supports risk review and improvement.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-044
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.10.1.5
  page: printed 29 / PDF 37
  paraphrase: The sponsor should periodically review risk control measures to ascertain whether the implemented quality management activities remain effective and relevant, taking into account emerging knowledge and experience; additional risk control measures may be implemented as needed.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-045
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.10.1.6
  page: printed 29 / PDF 37
  paraphrase: The sponsor should summarise and report important quality issues (including instances in which acceptable ranges are exceeded, see 3.10.1.3) and the remedial actions taken, and document them in the clinical trial report (see ICH E3).
  quote: document them in the clinical trial report (see ICH E3)
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-046
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.1
  page: printed 29 / PDF 37
  paraphrase: Quality assurance should be applied throughout the trial, implementing risk-based strategies to identify potential or actual causes of serious noncompliance with the protocol, GCP and applicable regulatory requirements to enable their corrective and preventive actions.
  quote: implementing risk-based strategies to identify potential or actual causes
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-047
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.3
  page: printed 30 / PDF 38
  paraphrase: Quality control should be applied using a risk-based approach at each stage of data handling; monitoring and data management are the main QC activities, which can extend to facilities outside investigator sites (e.g. central image reading).
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-048
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4
  page: printed 30-31 / PDF 38-39
  paraphrase: Monitoring is a principal QC activity; it should be performed by persons not involved in the clinical conduct of the trial at the site being monitored, the monitoring approach should be included in the monitoring plan, and the sponsor should determine the extent and nature of monitoring based on identified risks.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-049
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.1(a)
  page: printed 31 / PDF 39
  paraphrase: Investigator site monitoring (including pharmacies and local laboratories as appropriate) should have its frequency determined based on identified risks, and activities and frequency should be modified using knowledge gained.
  quote: be determined based on identified risks
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-050
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.2(a)
  page: printed 31 / PDF 39
  paraphrase: Centralised monitoring is an evaluation of accumulated data, performed in a timely manner by the sponsor's qualified and trained persons (e.g. medical monitor, data scientist/data manager, biostatistician).
  quote: Centralised monitoring is an evaluation of accumulated data
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-051
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.2(b)
  page: printed 31 / PDF 39
  paraphrase: Centralised monitoring can complement and reduce site monitoring or be used on its own; centralised data analytics can help identify systemic or site-specific issues, including protocol noncompliance and potentially unreliable data.
  quote: including protocol noncompliance and potentially unreliable data
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-052
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.2(c)
  page: printed 31 / PDF 39
  paraphrase: Centralised monitoring may support the selection of sites and/or processes for targeted investigator site monitoring.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-053
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.3
  page: printed 31 / PDF 39
  paraphrase: The sponsor should develop a monitoring plan tailored to identified potential safety risks, risks to data quality and other risks to reliability of results, describing strategy, monitoring activities of all parties, methods, tools and rationale; the plan should focus on aspects that are critical to quality.
  quote: The plan should focus on aspects that are critical to quality.
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-054
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.3
  page: printed 32 / PDF 40
  paraphrase: Monitoring of important data and processes performed outside the investigator site (e.g. those related to primary and key secondary endpoints or participant safety, such as central image reading or central laboratories) should be addressed in the monitoring plan.
  quote: should be addressed in the monitoring plan
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-055
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.4
  page: printed 32 / PDF 40
  paraphrase: Persons performing monitoring should follow the sponsor's monitoring plan and applicable monitoring procedures.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-056
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.5.1(a)
  page: printed 32 / PDF 40
  paraphrase: The sponsor should maintain communication with the investigator and other trial parties; each site should generally have an assigned monitor as point of contact.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-057
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.5.1(b)
  page: printed 32 / PDF 40
  paraphrase: Monitoring activities (per the sponsor's requirements and monitoring plan) include informing the investigator or other parties and individuals involved in the trial of relevant deviations from the protocol, GCP and applicable regulatory requirements.
  quote: relevant deviations from the protocol, GCP and the applicable regulatory requirements
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-058
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.5.1(b)
  page: printed 32 / PDF 40
  paraphrase: Monitoring should, if necessary, include taking appropriate action designed to prevent recurrence of the detected deviations.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-059
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.5.1(b)
  page: printed 32 / PDF 40
  paraphrase: Important deviations should be highlighted and should be the focus of remediation efforts.
  quote: Important deviations should be highlighted and should be the focus of remediation efforts
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-060
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.5.1(c)
  page: printed 32 / PDF 40
  paraphrase: Monitoring includes informing the investigator and others of errors or omissions in source records or data acquisition tools and ensuring corrections, additions or deletions are dated, explained if necessary and their approval documented.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-061
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.5.1(d)
  page: printed 32 / PDF 40
  paraphrase: Actions taken in relation to deviations, errors or omissions should be proportionate to their importance.
  quote: should be proportionate to their importance
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-062
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.5.2(b)
  page: printed 32-33 / PDF 40-41
  paraphrase: Monitoring includes confirming that site staff are informed about and follow the current approved protocol and other protocol-related documents.
  quote: follow the current approved protocol and other protocol-related documents
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-063
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.5.2(i)
  page: printed 33 / PDF 41
  paraphrase: Monitoring includes confirming that the investigator provides the required reports, notifications or other information in accordance with the protocol and trial procedures.
  quote: Confirming that the investigator provides the required reports, notifications or other information
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-064
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.5.4(a)
  page: printed 34 / PDF 42
  paraphrase: Monitoring of trial data includes verifying that the investigator is enrolling only eligible trial participants.
  quote: Verifying that the investigator is enrolling only eligible trial participants
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-065
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.5.4(b)(ii)
  page: printed 34 / PDF 42
  paraphrase: Monitoring of trial data (on-site and/or centralised, possibly sample-based) should identify missing data, inconsistent data, data outliers, unexpected lack of variability and protocol deviations.
  quote: Identify missing data, inconsistent data, data outliers, unexpected lack of variability and protocol deviations
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-066
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.5.4(c)
  page: printed 34 / PDF 42
  paraphrase: Monitoring of trial data should identify significant errors in data collection and reporting at a site or across sites, potential data manipulation and data integrity problems.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-067
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.6(a)
  page: printed 34 / PDF 42
  paraphrase: Reports of monitoring activities should include a summary of what was reviewed, a description of significant findings, conclusions and actions required to resolve them and follow-up on their resolution including items not resolved in previous reports; content and frequency are set in sponsor procedures.
  quote: a description of significant findings, conclusions and actions required to resolve them
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-068
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.6(b)
  page: printed 35 / PDF 43
  paraphrase: Investigator site and centralised monitoring reports should be provided to the appropriate sponsor staff in a timely manner for review and follow-up.
  quote: in a timely manner for review and follow-up
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-069
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.6(c)
  page: printed 35 / PDF 43
  paraphrase: When needed, the monitoring report should describe findings requiring escalation for action and resolution.
  quote: findings requiring escalation for action and resolution
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-070
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.11.4.6(c)
  page: printed 35 / PDF 43
  paraphrase: The sponsor should decide on the appropriate action to be taken on escalated findings; decisions and the resolution of actions should be documented where needed.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-071
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.12.1
  page: printed 35 / PDF 43
  paraphrase: Noncompliance with the protocol, SOPs, GCP and/or applicable regulatory requirements by an investigator/institution or by member(s) of the sponsor's staff should lead to appropriate and proportionate action by the sponsor to secure compliance.
  quote: should lead to appropriate and proportionate action by the sponsor to secure compliance
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-072
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.12.2
  page: printed 35 / PDF 43
  paraphrase: If noncompliance significantly affects or has the potential to significantly affect participant rights, safety or well-being or the reliability of trial results, the sponsor should perform a root cause analysis.
  quote: perform a root cause analysis, implement appropriate corrective and preventive actions
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-073
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.12.2
  page: printed 35 / PDF 43
  paraphrase: For such noncompliance the sponsor should implement appropriate corrective and preventive actions and confirm their adequacy, unless otherwise justified.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-074
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.12.2
  page: printed 35 / PDF 43
  paraphrase: Serious noncompliance is described as issues likely to significantly impact the rights, safety or well-being of trial participants or the reliability of trial results.
  quote: likely to significantly impact the rights, safety or well-being
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-075
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.12.2
  page: printed 35 / PDF 43
  paraphrase: Where the sponsor identifies serious noncompliance, it should notify the regulatory authority and/or IRB/IEC in accordance with applicable regulatory requirements, and/or the investigator, as appropriate.
  quote: (i.e., serious noncompliance), the sponsor should notify the
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-076
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.12.3
  page: printed 35 / PDF 43
  paraphrase: If significant noncompliance by an investigator/institution or service provider persists despite efforts at remediation, the sponsor should consider terminating that party's participation in the trial.
  quote: should consider terminating the investigator’s/institution’s or service provider’s participation
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-077
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.12.3
  page: printed 35 / PDF 43
  paraphrase: In that case the sponsor should promptly notify the regulatory authority(ies) and IRB/IEC of the serious noncompliance, as appropriate.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-078
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.12.3
  page: printed 35 / PDF 43
  paraphrase: The sponsor should also take action to minimise the impact on trial participants and on the reliability of trial results.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-079
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.13.3
  page: printed 36 / PDF 44
  paraphrase: The sponsor should take prompt action to address immediate hazards to participants, determine the causes of the hazard and take appropriate remedial actions.
  quote: take prompt action to address immediate hazards to participants
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-080
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.13.3
  page: printed 37 / PDF 45
  paraphrase: The sponsor should consider whether the protocol requires amendment in response to an immediate hazard; the information on the immediate hazard, if required, and any subsequent amendment should be submitted to the IRB/IEC and/or regulatory authorities by the investigator/institution or sponsor per applicable regulatory requirements.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-081
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.16.1(b)
  page: printed 39 / PDF 47
  paraphrase: The sponsor should apply QC to the relevant stages of data handling and focus QA and QC activities, including data review, on data of higher criticality and relevant metadata.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-082
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.16.1(w)
  page: printed 41 / PDF 49
  paraphrase: The sponsor should have processes and procedures for reporting incidents (including security breaches) that have a significant impact on trial data to relevant parties, regulatory authorities being named among them.
  quote: incidents (including security breaches) that have a significant impact on the trial data
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-083
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.16.1(x)(ix)
  page: printed 42-43 / PDF 50-51
  paraphrase: For all computerised systems, the sponsor should ensure a process for service providers and investigator(s)/institution(s) to inform the sponsor of incidents that could potentially constitute a serious noncompliance with the protocol, trial procedures, applicable regulatory requirements or GCP (see 3.12).
  quote: a process in place for service providers and investigator(s)/institution(s)
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-084
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.16.2(d)
  page: printed 43 / PDF 51
  paraphrase: Criteria for inclusion or exclusion of trial participants from any analysis set should be pre-defined (e.g. in the protocol or statistical analysis plan), and the rationale for excluding any participant or data point clearly described and documented.
  quote: criteria for inclusion or exclusion of trial participants
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-085
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.16.3(a)
  page: printed 43 / PDF 51
  paraphrase: The sponsor (or subsequent data owner) should retain the sponsor-specific essential records in accordance with applicable regulatory requirements (see Appendix C).
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-086
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A2-2.4
  page: printed 55 / PDF 63
  paraphrase: Investigator oversight should be proportionate to the importance of the data being collected and to the risks to participant rights, safety and well-being and data reliability; it may range from direct supervision to review of essential records, in person or via remote communication.
  quote: proportionate to the importance of the data being collected
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-087
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A2-2.4.1
  page: printed 56 / PDF 64
  paraphrase: Where healthcare professionals conduct trial activities within usual clinical practice, the protocol should describe these activities and appropriate arrangements should cover information sharing, record retention, privacy and data integrity; investigator oversight should be proportionate to data criticality and ensure that resulting records meet the relevant protocol requirements.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-088
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A2-3.2.2
  page: printed 57 / PDF 65
  paraphrase: Sponsors considering pragmatic elements should assess whether the approach is fit for purpose and complies with applicable regulatory requirements, and ensure the protocol clearly describes how, by whom and under what circumstances these activities will be performed.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-089
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A2-3.8
  page: printed 62 / PDF 70
  paraphrase: Sponsor oversight should be proportionate to the potential impact on participant protection and reliability of results; quality control and assurance should be customised to the trial and its critical to quality factors and identified risks.
  quote: specifically customised to the clinical trial and its critical to quality factors
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-090
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A2-3.8
  page: printed 62 / PDF 70
  paraphrase: Sponsors should maintain appropriate oversight of service providers, including of their essential records; where the sponsor arranges activities under investigator responsibility (e.g. home nursing), the investigator retains the ability to decide whether the proposed provider is appropriate.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-091
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: P6.2
  page: printed 5 / PDF 13
  paraphrase: Critical to quality factors are attributes of a trial that are fundamental to the protection of participants, the reliability and interpretability of the trial results and the decisions made based on those results.
  quote: attributes of a trial that are fundamental to the protection of participants
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-092
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.10.6
  page: printed 20 / PDF 28
  paraphrase: The investigator should ensure that the investigational product(s) are used only in accordance with the approved protocol.
  quote: used only in accordance with the approved protocol
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-093
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.11
  page: printed 21 / PDF 29
  paraphrase: The investigator should follow the randomisation procedures, break the code only in accordance with the protocol, and promptly document and explain to the sponsor any premature unblinding (e.g. accidental, emergency, due to an SAE).
  quote: promptly document and explain to the sponsor any premature unblinding
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-094
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.12.3
  page: printed 21 / PDF 29
  paraphrase: The investigator should be provided with timely access to data by the sponsor and is responsible for timely review of data, including relevant external data that can affect e.g. participant eligibility, treatment or safety.
  quote: be responsible for the timely review of data
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-095
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-2.12.10(e)
  page: printed 22 / PDF 30
  paraphrase: When using computerised systems, the investigator/institution should ensure that incidents in their use and operation which, in its judgement, may have a significant and/or persistent impact on trial data or system security are reported to the sponsor and, where applicable, to the IRB/IEC.
  quote: are reported to the sponsor and, where applicable, to the IRB/IEC
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-096
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.1.4
  page: printed 23 / PDF 31
  paraphrase: The sponsor should ensure all aspects of the trial are operationally feasible and avoid unnecessary complexity, procedures and data collection; protocols, data acquisition tools and other operational documents should be fit for purpose, clear, concise and consistent.
  quote: should avoid unnecessary complexity, procedures and data collection
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-097
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.3
  page: printed 24 / PDF 32
  paraphrase: Prior to initiating clinical trial activities, the sponsor should determine the roles and allocate trial-related activities accordingly.
  quote: the sponsor should determine the roles and allocate their trial-related activities accordingly
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-098
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.6.3(a)
  page: printed 24 / PDF 32
  paraphrase: The sponsor should obtain the investigator's/institution's and, where applicable, service provider's agreement to conduct the trial in accordance with the approved protocol and in compliance with GCP and applicable regulatory requirements.
  quote: To conduct the trial in accordance with the approved protocol
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-099
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.6.6
  page: printed 25 / PDF 33
  paraphrase: The sponsor retains ultimate responsibility for transferred activities; any service provider performing trial activities should implement appropriate quality management and report to the sponsor incidents that might impact participant safety and/or trial results.
  quote: report to the sponsor incidents that might have an impact on the safety
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-100
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-3.17.2(a)
  page: printed 44 / PDF 52
  paraphrase: Whether the trial is completed, prematurely terminated or interim-analysed for submission, the sponsor should ensure clinical trial reports (including interim reports) are prepared and provided to regulatory authorities as required, and that reports in marketing applications meet the standards of ICH E3 or applicable requirements.
  quote: meet the standards of ICH E3
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-101
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-4.2.2
  page: printed 46-47 / PDF 54-55
  paraphrase: For data of higher criticality, the responsible party should evaluate system metadata so that initial entries and subsequent changes or deletions are documented with reasons where appropriate, ensure audit trails and logs are not disabled and are interpretable, and determine which metadata require review and retention.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-102
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-4.2.3
  page: printed 47 / PDF 55
  paraphrase: Procedures for review of trial-specific data, audit trails and other relevant metadata should be in place; review should be planned, risk-based, trial-adapted and adjusted with experience.
  quote: Procedures for review of trial-specific data, audit trails and other relevant metadata
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-103
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-4.2.4
  page: printed 47 / PDF 55
  paraphrase: There should be processes to correct data errors that could impact reliability; corrections should be attributed, justified, supported by source records around the time of original entry and performed in a timely manner.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-104
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-4.2.6(b)
  page: printed 48 / PDF 56
  paraphrase: Activities undertaken to finalise data sets prior to analysis should be confirmed and documented in accordance with pre-specified procedures.
  quote: should be confirmed and documented in accordance with pre-specified procedures
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-105
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-4.2.6(b)
  page: printed 48 / PDF 56
  paraphrase: Data finalisation activities may include reconciliation, rectification of data errors and omissions, medical coding, and compilation of and addressing the impact of noncompliance issues, including protocol deviations.
  quote: compilation of and addressing the impact of noncompliance issues, including protocol deviations
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-106
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-4.2.6(c)
  page: printed 48 / PDF 56
  paraphrase: Data extraction and determination of data analysis sets should take place in accordance with the planned statistical analysis and should be documented.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-107
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-4.2.7
  page: printed 48 / PDF 56
  paraphrase: Trial data and relevant metadata should be archived so they remain retrievable and readable and protected from unauthorised access and alteration throughout the retention period.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-108
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: A1-4.3.4(a)
  page: printed 49 / PDF 57
  paraphrase: The responsible party is responsible for the validation status of a computerised system throughout its life cycle; the validation approach should be risk-based, considering intended use, importance of the data and potential impact on participants and reliability of results.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-109
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppB-Intro
  page: printed 70 / PDF 78
  paraphrase: Building adaptability into the protocol, for example acceptable ranges for specific protocol provisions, can reduce the number of deviations or the need for amendments; such adaptability should not adversely affect participant safety or scientific validity.
  quote: can reduce the number of deviations
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-110
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppB-B.2.5
  page: printed 70 / PDF 78
  paraphrase: The protocol should generally include a statement that the trial will be conducted in compliance with the protocol, GCP and applicable regulatory requirements.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-111
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppB-B.10.4
  page: printed 73 / PDF 81
  paraphrase: The protocol should generally describe the selection of participants for the planned analyses, the statistical methods and procedures for handling intercurrent events and missing, unused and spurious data, aligned with target estimands where defined (see ICH E9(R1)).
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-112
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppB-B.12.1
  page: printed 74 / PDF 82
  paraphrase: The protocol should generally describe identified critical to quality factors, associated risks and risk mitigation strategies, unless documented elsewhere.
  quote: Description of identified critical to quality factors, associated risks and risk mitigation strategies
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-113
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppB-B.12.2
  page: printed 74 / PDF 82
  paraphrase: The protocol should generally include a summary of the monitoring approaches that are part of the quality control process.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-114
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppB-B.12.3
  page: printed 74 / PDF 82
  paraphrase: The protocol should generally include a description of the process for handling noncompliance with the protocol or GCP.
  quote: Description of the process for the handling of noncompliance with the protocol or GCP.
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-115
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.1.3
  page: printed 75 / PDF 83
  paraphrase: Essential records permit evaluation of investigator and sponsor compliance with GCP and regulations and of result reliability; they are used in investigator and sponsor oversight (including monitoring), audit, inspection and IRB/IEC review; the investigator/institution should have access to, maintain and retain its essential records per applicable regulatory requirements.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-116
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.2.3
  page: printed 75 / PDF 83
  paraphrase: Essential records should be maintained in or referred to from repositories held by the sponsor and the investigator/institution, which may be referred to as trial master file (TMF) and investigator site file (ISF).
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-117
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.2.5
  page: printed 75-76 / PDF 83-84
  paraphrase: The sponsor and investigator/institution should ensure essential records are collected and filed in a timely manner.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-118
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.2.6
  page: printed 76 / PDF 84
  paraphrase: Essential records should be retained complete, readable, readily available and directly accessible on request by regulatory authorities, monitors and auditors; alterations should be traceable.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-119
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.3.1(a)
  page: printed 77 / PDF 85
  paraphrase: A record is essential if it is a document submitted to or issued by the regulatory authority or IRB/IEC, including related correspondence and documentation of regulatory decisions or approvals/favourable opinions.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-120
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.3.1(r)
  page: printed 78 / PDF 86
  paraphrase: A record is essential if it documents sponsor oversight of site selection, monitoring and audit and provides information on arising issues/noncompliance and deviations detected and implementation of corrective and preventative actions.
  quote: arising issues/noncompliance and deviations detected and implementation of corrective and preventative actions
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-121
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.3.1(s)
  page: printed 78 / PDF 86
  paraphrase: A record is essential if it documents compliance with the protocol and/or procedures for data management, statistical analysis and production of interim and final reports.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-122
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.3.2
  page: printed 78-79 / PDF 86-87
  paraphrase: Trial records listed in the Essential Records Table should be retained when produced; the table is not exhaustive, and some records depend on trial design, conduct and risk-proportionate management (C.3.3); no fixed retention period is given (retention per applicable regulatory requirements).
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-123
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.3.2
  page: printed 81 / PDF 89
  paraphrase: 'Essential Records Table row: ''Records and reports of noncompliance including protocol deviations and corrective and preventative actions'' - essential and to be retained if produced (not marked as required before trial start).'
  quote: Records and reports of noncompliance including protocol deviations and corrective and preventative actions
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-124
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.3.2
  page: printed 81 / PDF 89
  paraphrase: 'Essential Records Table rows: ''Site monitoring reports (including site selection, initiation, routine and close-out)'' and ''Centralised monitoring reports'' - essential and to be retained if produced.'
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-125
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.3.2
  page: printed 81 / PDF 89
  paraphrase: 'Essential Records Table row: ''Documentation relating to data finalisation for analysis'' (e.g. query resolutions, SAE reconciliation, QC reports, coding completion, output data sets) - essential and to be retained if produced.'
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-126
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.3.2
  page: printed 81 / PDF 89
  paraphrase: 'Essential Records Table row: ''Documentation relating to the statistical considerations and analysis'' including analysis sets decisions - essential and to be retained if produced.'
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-127
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.3.2
  page: printed 81 / PDF 89
  paraphrase: 'Essential Records Table row: ''Trial-specific plans (e.g., risk management, monitoring, safety, data management, data validation and statistical analysis) and procedures''; risk management, monitoring, data management and data validation plans are asterisked, i.e. should generally be in place before trial start (C.2.5).'
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-128
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.3.2
  page: printed 79 / PDF 87
  paraphrase: 'Essential Records Table rows: ''Signed protocol and subsequent amendments during the trial'' and ''Regulatory authority(ies) authorisation, approval and/or notification of the protocol and of subsequent amendments (where required)'' - essential and to be retained.'
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-129
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: AppC-C.3.2
  page: printed 79 / PDF 87
  paraphrase: 'Essential Records Table row: ''Interim (where applicable) and final clinical trial reports'' - essential and to be retained.'
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-130
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Compliance (in relation to trials)
  page: printed 84 / PDF 92
  paraphrase: Compliance in relation to trials means adherence to the trial-related requirements, GCP requirements and the applicable regulatory requirements.
  quote: Adherence to the trial-related requirements, GCP requirements and the applicable regulatory requirements.
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-131
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Protocol
  page: printed 88 / PDF 96
  paraphrase: The protocol is the document describing objectives, design, methodology, statistical considerations and organisation of a trial; throughout the guideline 'protocol' refers to protocol and protocol amendments.
  quote: the term “protocol” refers to protocol and protocol amendments
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-132
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Protocol Amendment
  page: printed 88 / PDF 96
  paraphrase: A protocol amendment is a documented description of a change(s) to a protocol.
  quote: A documented description of a change(s) to a protocol.
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-133
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Monitoring
  page: printed 88 / PDF 96
  paraphrase: Monitoring is the act of overseeing the progress of a clinical trial and ensuring it is conducted, recorded and reported per the protocol, SOPs, GCP and applicable regulatory requirements.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-134
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Monitoring Plan
  page: printed 88 / PDF 96
  paraphrase: A monitoring plan is a document that describes the strategy, methods, responsibilities and requirements for monitoring the trial.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-135
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Monitoring Report
  page: printed 88 / PDF 96
  paraphrase: A monitoring report is a documented report following site and/or centralised monitoring activities.
  quote: A documented report following site and/or centralised monitoring activities.
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-136
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Essential Records
  page: printed 85-86 / PDF 93-94
  paraphrase: Essential records are the documents and data (and relevant metadata), in any format, that facilitate trial management and allow evaluation of methods used, factors affecting the trial and actions taken, to determine reliability of results and verify conduct per GCP and regulations (see Appendix C).
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-137
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Audit Trail
  page: printed 83 / PDF 91
  paraphrase: An audit trail is metadata that captures actions on data and records (by whom, when and, where applicable, why); in computerised systems it should be secure, computer-generated and time stamped.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-138
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Source Records
  page: printed 89 / PDF 97
  paraphrase: Source records are original documents or data (including relevant metadata) or certified copies, irrespective of media, e.g. medical records, participant-entered data, pharmacy and laboratory records and data from automated instruments.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-139
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Clinical Trial/Study Report (CSR)
  page: printed 84 / PDF 92
  paraphrase: A clinical trial/study report (CSR) is a documented description of a trial in which clinical and statistical description, presentations and analyses are fully integrated into a single report (see ICH E3).
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-140
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Sponsor
  page: printed 90 / PDF 98
  paraphrase: The sponsor is an individual, company, institution or organisation that takes responsibility for initiation, management and arrangement of financing of a trial; with several sponsors, unattributed responsibilities lie with all.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-141
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Investigator
  page: printed 87 / PDF 95
  paraphrase: The investigator is the person responsible for the conduct of the trial at a site, including the participants under their responsibility; 'investigator/institution' expectations may apply to the investigator and/or institution.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-142
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Institutional Review Board (IRB)/Independent Ethics Committee (IEC)
  page: printed 87 / PDF 95
  paraphrase: An IRB/IEC is an independent body of medical and non-medical members responsible for protecting participants' rights, safety and well-being, inter alia by reviewing and approving/providing favourable opinion on the protocol.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-143
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Regulatory Authorities
  page: printed 89 / PDF 97
  paraphrase: Regulatory authorities are bodies having the power to regulate, including those reviewing protocols and clinical data and conducting inspections; sometimes called competent authorities.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R1-144
  src: E6R3
  doc: ICH E6(R3) Guideline for Good Clinical Practice (GCP), Final version, Step 4, consolidated with Annex 2, 16 June 2026
  url: https://database.ich.org/sites/default/files/ICH%20E6%28R3%29_Step4_FinalConsolidatedGuideline_2026_0616_.pdf
  loc: GL:Service Provider
  page: printed 89 / PDF 97
  paraphrase: A service provider is a person or organisation (commercial, academic or other) providing a service used by the sponsor or investigator to fulfil trial-related activities.
  quote: ''
  local_text: vendor/sources/e6r3/E6R3_consolidated_2026-06-16.txt
- id: R2-001
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3
  page: printed 3
  paraphrase: Quality by design means concentrating on critical to quality factors so that participants' rights, safety and well-being are protected, results are reliable and meaningful, and risks to those factors are managed in proportion to the risk. A framework for identifying and reviewing these factors supports the approach from design and planning through conduct, analysis and reporting.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-002
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.1
  page: printed 3
  paraphrase: Quality is built in prospectively through attention to the protocol, procedures, operational plans and training, which can raise the chance of answering the study questions and avoiding important errors. Retrospective document and data review, monitoring and audits are an important part of quality assurance but, even combined, are not sufficient on their own to ensure study quality (statement, no 'should').
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-003
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.2
  page: printed 4
  paraphrase: Critical to quality factors are attributes of a study whose integrity is fundamental to protecting participants, to the reliability and interpretability of the results, and to the decisions based on them. They are critical because errors in design or conduct that undermine them would also undermine the reliability or ethics of those decisions.
  quote: attributes of a study whose integrity is fundamental
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-004
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.2
  page: printed 4
  paraphrase: The sponsor and the other parties designing quality into a study should identify its critical to quality factors; each study should have a basic set of quality-relevant factors identified, with emphasis on those that are critical to study quality.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-005
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.2
  page: printed 4
  paraphrase: Critical to quality factors should be considered as a whole so that interdependencies between them are recognised.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-006
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.2
  page: printed 4
  paraphrase: Study design should reflect current knowledge of the drug, the condition, the underlying biology and the intended population; knowledge accumulated at each development stage continues to inform which factors are critical and which controls are used to manage them.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-007
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.2
  page: printed 4
  paraphrase: Once critical to quality factors are identified, the risks to them are to be determined and a decision taken whether each risk is acceptable or should be mitigated, based on its probability, detectability and impact (framed in the source as important).
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-008
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.2
  page: printed 4
  paraphrase: The term risk is used in the sense of general risk management methodology and applies to all factors of a study.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-009
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.2
  page: printed 4
  paraphrase: Where a risk to a critical to quality factor is to be mitigated, the necessary control processes should be put in place and communicated, and the necessary mitigating actions taken.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-010
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.2
  page: printed 4
  paraphrase: Proactive, ongoing communication about critical to quality factors and risk mitigation activities supports a shared understanding by sponsor and sites of priorities and resource allocation (presented as beneficial, no 'should').
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-011
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.2
  page: printed 4-5
  paraphrase: Proactive support, for example site training appropriate to role and a description in the protocol of the critical to quality factors and potential mitigation measures, helps ensure the protocol, procedures and associated plans are implemented correctly.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-012
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.2
  page: printed 5
  paraphrase: Because perfection in every aspect is rarely achievable, or only with disproportionate resources, quality factors should be prioritised at the design stage to identify those that are critical, and procedures should be proportionate to the risks and to the importance of the information collected.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-013
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.2
  page: printed 5
  paraphrase: Critical to quality factors should be clear and should not be cluttered with minor issues, for example those arising from extensive secondary objectives or from processes and data collection unrelated to participant protection or the primary objectives.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-014
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.3
  page: printed 5
  paraphrase: Identifying critical to quality factors should include judging whether the objectives can be met effectively and efficiently with the chosen design and data sources; the quality approach asks whether objectives are clear, the design answers the question, the question matters to patients and hypotheses are specific and valid. Early patient consultation can support this.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-015
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.3
  page: printed 5
  paraphrase: Study designs should be operationally feasible and avoid unnecessary complexity; protocols and data collection tools should allow the study to be conducted as designed and avoid unnecessary data collection.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-016
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.3.1
  page: printed 5
  paraphrase: A culture that values critical thinking and open dialogue, beyond tools and checklists, is encouraged; inflexible one-size-fits-all approaches should be discouraged, and while standard operating procedures are necessary, study-specific strategies and actions are also needed to ensure quality.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-017
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.3.1
  page: printed 5
  paraphrase: Evidence supporting quality decisions should be gathered and reviewed transparently before and during the study, acknowledging known gaps and conflicts and anticipating new ones.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-018
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.3.2
  page: printed 5
  paraphrase: Effort should focus on activities essential to reliable and meaningful outcomes and to safe, ethical conduct, and consideration should be given to eliminating nonessential activities and data collection.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-019
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.3.2
  page: printed 6
  paraphrase: Resources should be directed to detecting, and to preventing or controlling, the errors that matter.
  quote: Resources should be deployed to identify and prevent or control errors that matter.
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-020
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.3.3
  page: printed 6
  paraphrase: Study design benefits from input from a broad range of stakeholders, including patients and healthcare providers, and should be open to challenge by internal and external experts; investigators, study coordinators, other site staff and patients or patient organisations may contribute insight, for example on enrolment feasibility, visit burden that could cause dropouts, and endpoint relevance.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-021
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.3.3
  page: printed 6
  paraphrase: Early engagement with regulatory authorities is encouraged, particularly where novel critical elements such as populations, procedures or endpoints are involved.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-022
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.3.4
  page: printed 6
  paraphrase: Accumulated experience and knowledge, together with periodic review of the critical to quality factors, should inform whether risk control mechanisms need adjustment, because new or unanticipated issues may arise once the study has started.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-023
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.3.4
  page: printed 6
  paraphrase: Studies with adaptive features and/or interim decision points need specific attention in proactive planning, ongoing review and risk management.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-024
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.3.5
  page: printed 6
  paraphrase: A successful study rests on a protocol that is scientifically sound and operationally feasible; the feasibility assessment considers design and implementation elements that could affect operational completion, including regional practice, qualified investigators, equipment and facilities, availability of the target population and enrolment capacity.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-025
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S3.3.5
  page: printed 6
  paraphrase: Retention and follow-up of study participants are also key critical to quality factors.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-026
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S6.1
  page: printed 18
  paraphrase: Quality by design principles should guide study conduct and reporting, and risk-proportionate mitigation measures should be used to preserve the integrity of the critical to quality factors.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-027
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S6.1.1
  page: printed 18
  paraphrase: Adherence to the protocol and related documents is essential, and many aspects of adherence should be counted among the study's critical to quality factors.
  quote: aspects of adherence should be considered among the study's critical to quality factors
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-028
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S6.1.1
  page: printed 18
  paraphrase: Good quality by design may reduce the number of protocol amendments and support ongoing adherence; where an amendment is necessary, its rationale should be clearly explained and its impact on study conduct carefully considered.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-029
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S6.1.2
  page: printed 18
  paraphrase: People involved in conducting the study should receive training appropriate to their role before they take part.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-030
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S6.1.2
  page: printed 18
  paraphrase: Updated training or retraining may be needed to address issues with critical to quality factors that arise during the study, or protocol amendments.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-031
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S6.1.3
  page: printed 18
  paraphrase: Operational checks, centralised data monitoring and statistical surveillance can detect important data quality issues so that corrective action can be taken.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-032
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S6.3
  page: printed 19
  paraphrase: Designing the study report is part of quality by design, and the report should describe the critical to quality factors of the study.
  quote: The report should describe the critical to quality factors in the study.
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-033
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20-21
  paraphrase: Identification of critical to quality factors should be supported by early cross-functional discussion and decisions during study planning, and the 18 listed aspects should be considered where relevant when designing a study; the list is not exhaustive, may not apply to every study, and other aspects may be needed.
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-034
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 1 of 18
  paraphrase: 'CtQ consideration: relevant stakeholders, including patients, are engaged in study planning and design.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-035
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 2 of 18
  paraphrase: 'CtQ consideration: the prerequisite non-clinical studies and, where applicable, clinical studies are complete and adequate to support the study.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-036
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 3 of 18
  paraphrase: 'CtQ consideration: study objectives address relevant scientific questions suited to the study''s role in development, taking accumulated product knowledge into account.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-037
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 4 of 18
  paraphrase: 'CtQ consideration: the design supports a meaningful comparison of the drug''s effects with the chosen control group.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-038
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 5 of 18
  paraphrase: 'CtQ consideration: adequate measures protect participants'' rights, safety and welfare, for example informed consent, ethics review, investigator and site training, and pseudonymisation.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-039
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 6 of 18
  paraphrase: 'CtQ consideration: information provided to participants should be clear and understandable.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-040
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 7 of 18
  paraphrase: 'CtQ consideration: the competencies and training that sponsor and investigator staff need for their roles in the study are identified.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-041
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 8 of 18
  paraphrase: 'CtQ consideration: study feasibility should be assessed to ensure the study is operationally viable.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-042
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 9 of 18
  paraphrase: 'CtQ consideration: the number of participants, study duration and visit frequency are sufficient to support the objectives.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-043
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 10 of 18
  paraphrase: 'CtQ consideration: eligibility criteria reflect the study objectives and are well documented in the protocol.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-044
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 11 of 18
  paraphrase: 'CtQ consideration: the protocol specifies the data needed to meet the objectives, understand benefit-risk and monitor safety.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-045
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 12 of 18
  paraphrase: 'CtQ consideration: response variables and the methods to assess them are well defined and support evaluation of the drug''s effects.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-046
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 13 of 18
  paraphrase: 'CtQ consideration: study procedures include adequate measures to minimise bias, such as randomisation and blinding.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-047
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 14 of 18
  paraphrase: 'CtQ consideration: the statistical analysis plan is pre-specified and defines analysis methods appropriate to the endpoints and populations.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-048
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 15 of 18
  paraphrase: 'CtQ consideration: systems and processes are in place that support study conduct and ensure the integrity of critical study data.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-049
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 16 of 18
  paraphrase: 'CtQ consideration: the extent and nature of study monitoring are tailored to the study design, objectives and participant safety needs.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-050
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 17 of 18
  paraphrase: 'CtQ consideration: the need for, and appropriate role of, a data monitoring committee is assessed.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-051
  src: E8R1
  doc: ICH E8(R1) General Considerations for Clinical Studies, Final version, Step 4, adopted 6 October 2021
  url: https://database.ich.org/sites/default/files/E8-R1_Guideline_Step4_2021_1006.pdf
  loc: S7
  page: printed 20; bullet 18 of 18
  paraphrase: 'CtQ consideration: reporting of study results is planned, comprehensive, accurate, timely and publicly accessible.'
  quote: ''
  local_text: vendor/sources/E8R1/doc_3.txt
- id: R2-052
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: SIntroduction
  page: printed 1-2
  paraphrase: The design and conduct sections of the report should clarify features not well described in the protocol and identify how the study as conducted differed from the protocol, and the report should discuss the statistical methods used to account for these deviations from the planned protocol.
  quote: ''
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-053
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: S9.8
  page: printed 12
  paraphrase: Any change in study conduct or planned analyses made after the study started (for example dropping a treatment group, changing entry criteria or doses, adjusting sample size) should be described, with timing, reasons, decision procedure, responsible persons or groups and the data available (and to whom) at the time, whether or not the change was made by formal protocol amendment; implications for interpretation should be discussed.
  quote: ''
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-054
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: S10.1
  page: printed 12-13
  paraphrase: The report should account clearly for all patients who entered the study, give the numbers randomised and completing each phase, and give the reasons for all post-randomisation discontinuations by treatment and major reason (for example lost to follow-up, adverse event, poor compliance); appendix 16.2.1 lists all discontinued patients by centre and treatment group with the specific reason.
  quote: ''
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-055
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: S10.2
  page: printed 13
  paraphrase: All important deviations related to inclusion or exclusion criteria, conduct of the study, patient management or patient assessment should be described in the report.
  quote: All important deviations related to study inclusion or exclusion criteria
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-056
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: S10.2
  page: printed 13
  paraphrase: In the body of the report, protocol deviations should be appropriately summarised by centre and grouped into different categories.
  quote: ''
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-057
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: S10.2
  page: printed 13
  paraphrase: 'Example deviation categories: patients who entered the study without meeting the entry criteria; patients who developed withdrawal criteria during the study but were not withdrawn; patients who received the wrong treatment or an incorrect dose; patients who received an excluded concomitant treatment.'
  quote: ''
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-058
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: S10.2
  page: printed 13
  paraphrase: Individual patients with these protocol deviations should be listed in appendix 16.2.2, broken down by centre for multicentre studies.
  quote: ''
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-059
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: S11.1
  page: printed 13
  paraphrase: The patients included in each efficacy analysis should be precisely defined; if the inclusion and exclusion rules for analyses were not defined in the protocol, the report should explain when (relative to unblinding) and how they were developed; a study intended to establish efficacy should also include an analysis of all randomised or enrolled patients with on-treatment data. The section does not itself name protocol deviations as an exclusion basis.
  quote: ''
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-060
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: S11.1
  page: printed 13
  paraphrase: A tabular listing of all patients, visits and observations excluded from the efficacy analysis should be provided in appendix 16.2.3, with Annex VI as an example format.
  quote: ''
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-061
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: S11.1
  page: printed 13
  paraphrase: The reasons for exclusions should also be analysed for the whole treatment group over time, with Annex VII as an example format.
  quote: ''
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-062
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: S11.4.2.6
  page: printed 17
  paraphrase: Where patients with available data are dropped from an efficacy subset for reasons such as poor compliance, missed visits or ineligibility, the effect on the results should be examined closely; an analysis of all available data should be performed for every study intended to establish efficacy, and important differences arising from the choice of population should be discussed explicitly.
  quote: ''
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-063
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: S16.2
  page: printed 29
  paraphrase: The appendix structure for patient data listings includes 16.2.1 discontinued patients, 16.2.2 protocol deviations and 16.2.3 patients excluded from the efficacy analysis (titles only; the content requirements sit in sections 10.1, 10.2 and 11.1).
  quote: ''
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-064
  src: E3
  doc: ICH Harmonised Tripartite Guideline E3 Structure and Content of Clinical Study Reports, Current Step 4 version, 30 November 1995
  url: https://database.ich.org/sites/default/files/E3_Guideline.pdf
  loc: SAnnex-IVa
  page: printed 35 [verify]
  paraphrase: The example patient disposition flowchart in Annex IVa lists 'protocol violation' as a reason for withdrawal; the E3 Q&A (R1) later clarifies the intended meaning and suggests relabelling it 'protocol deviation'.
  quote: ''
  local_text: vendor/sources/E3/doc_4.txt
- id: R2-065
  src: E3QA
  doc: ICH E3 Guideline Structure and Content of Clinical Study Reports - Questions and Answers (R1), Step 4, current version 6 July 2012
  url: https://database.ich.org/sites/default/files/E3_Q&As_R1_Q&As.pdf
  loc: S1
  page: printed 1-2
  paraphrase: E3 is a guideline, not a set of rigid requirements or a template, with flexibility built in; each report should consider all topics described unless clearly not relevant, sequence and grouping may be changed, and where a relevant aspect is omitted the report should say so and give the reason.
  quote: ''
  local_text: vendor/sources/E3QA/doc_5.txt
- id: R2-066
  src: E3QA
  doc: ICH E3 Guideline Structure and Content of Clinical Study Reports - Questions and Answers (R1), Step 4, current version 6 July 2012
  url: https://database.ich.org/sites/default/files/E3_Q&As_R1_Q&As.pdf
  loc: S3
  page: printed 6
  paraphrase: A protocol deviation is any change, divergence or departure from the study design or procedures defined in the protocol.
  quote: any change, divergence, or departure from the study design or procedures
  local_text: vendor/sources/E3QA/doc_5.txt
- id: R2-067
  src: E3QA
  doc: ICH E3 Guideline Structure and Content of Clinical Study Reports - Questions and Answers (R1), Step 4, current version 6 July 2012
  url: https://database.ich.org/sites/default/files/E3_Q&As_R1_Q&As.pdf
  loc: S3
  page: printed 6
  paraphrase: Important protocol deviations are the subset of protocol deviations that may significantly affect the completeness, accuracy and/or reliability of the study data, or that may significantly affect a subject's rights, safety or well-being.
  quote: may significantly impact the completeness, accuracy, and/or reliability of the study data
  local_text: vendor/sources/E3QA/doc_5.txt
- id: R2-068
  src: E3QA
  doc: ICH E3 Guideline Structure and Content of Clinical Study Reports - Questions and Answers (R1), Step 4, current version 6 July 2012
  url: https://database.ich.org/sites/default/files/E3_Q&As_R1_Q&As.pdf
  loc: S3
  page: printed 6
  paraphrase: Examples of important protocol deviations may include enrolling subjects in violation of key eligibility criteria designed to ensure a specific population, or failing to collect data needed to interpret primary endpoints, as this may compromise the scientific value of the trial.
  quote: ''
  local_text: vendor/sources/E3QA/doc_5.txt
- id: R2-069
  src: E3QA
  doc: ICH E3 Guideline Structure and Content of Clinical Study Reports - Questions and Answers (R1), Step 4, current version 6 July 2012
  url: https://database.ich.org/sites/default/files/E3_Q&As_R1_Q&As.pdf
  loc: S3
  page: printed 6
  paraphrase: The terms 'protocol violation' and 'important protocol deviation' are sometimes used interchangeably for a significant departure from protocol requirements; 'violation' may also carry other meanings in a regulatory context.
  quote: ''
  local_text: vendor/sources/E3QA/doc_5.txt
- id: R2-070
  src: E3QA
  doc: ICH E3 Guideline Structure and Content of Clinical Study Reports - Questions and Answers (R1), Step 4, current version 6 July 2012
  url: https://database.ich.org/sites/default/files/E3_Q&As_R1_Q&As.pdf
  loc: S3
  page: printed 6-7
  paraphrase: In E3 Annex IVa (subject disposition), 'protocol violation' was meant only for a departure from study requirements, by the subject or investigator, that resulted in the subject's withdrawal from study participation; whether such subjects are included in the analysis is a separate question.
  quote: ''
  local_text: vendor/sources/E3QA/doc_5.txt
- id: R2-071
  src: E3QA
  doc: ICH E3 Guideline Structure and Content of Clinical Study Reports - Questions and Answers (R1), Step 4, current version 6 July 2012
  url: https://database.ich.org/sites/default/files/E3_Q&As_R1_Q&As.pdf
  loc: S3
  page: printed 7-8
  paraphrase: To avoid confusion, sponsors are encouraged to replace 'protocol violation' in Annex IVa with 'protocol deviation', as shown in the example flowchart on page 8, or may use another descriptor if the information is broadly consistent with the stated definition.
  quote: ''
  local_text: vendor/sources/E3QA/doc_5.txt
- id: R2-072
  src: E3QA
  doc: ICH E3 Guideline Structure and Content of Clinical Study Reports - Questions and Answers (R1), Step 4, current version 6 July 2012
  url: https://database.ich.org/sites/default/files/E3_Q&As_R1_Q&As.pdf
  loc: S3
  page: printed 7
  paraphrase: Deviations generally considered important, as exemplified in E3, should be described in CSR section 10.2 and included in the appendix 16.2.2 listing; the Q&A does not say whether non-important deviations are also reported.
  quote: ''
  local_text: vendor/sources/E3QA/doc_5.txt
- id: R2-073
  src: E3QA
  doc: ICH E3 Guideline Structure and Content of Clinical Study Reports - Questions and Answers (R1), Step 4, current version 6 July 2012
  url: https://database.ich.org/sites/default/files/E3_Q&As_R1_Q&As.pdf
  loc: S3
  page: printed 7
  paraphrase: The definition of important protocol deviations for a particular trial is determined in part by the study design, the critical procedures, the study data, the subject protections described in the protocol, and the planned analyses of study data.
  quote: ''
  local_text: vendor/sources/E3QA/doc_5.txt
- id: R2-074
  src: E3QA
  doc: ICH E3 Guideline Structure and Content of Clinical Study Reports - Questions and Answers (R1), Step 4, current version 6 July 2012
  url: https://database.ich.org/sites/default/files/E3_Q&As_R1_Q&As.pdf
  loc: S3
  page: printed 7
  paraphrase: Consistent with the flexibility of E3, sponsors may amend or add to the E3 examples of important deviations to fit the needs of the trial.
  quote: ''
  local_text: vendor/sources/E3QA/doc_5.txt
- id: R2-075
  src: E3QA
  doc: ICH E3 Guideline Structure and Content of Clinical Study Reports - Questions and Answers (R1), Step 4, current version 6 July 2012
  url: https://database.ich.org/sites/default/files/E3_Q&As_R1_Q&As.pdf
  loc: S3
  page: printed 7
  paraphrase: Substantial additions to or changes of the E3 examples of important deviations should be clearly described for the reviewer.
  quote: ''
  local_text: vendor/sources/E3QA/doc_5.txt
- id: R2-076
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2
  page: printed 22
  paraphrase: The set of subjects whose data are included in the main analyses should be defined in the statistical section of the protocol.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-077
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2
  page: printed 22
  paraphrase: The protocol should specify procedures aimed at minimising anticipated irregularities in study conduct that might impair a satisfactory analysis, including protocol violations, withdrawals and missing values.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-078
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2
  page: printed 22
  paraphrase: The protocol should consider ways both to reduce the frequency of such problems and to handle in the analysis the problems that do occur.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-079
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2
  page: printed 22
  paraphrase: Possible amendments to the way the analysis will deal with protocol violations should be identified during the blind review.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-080
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2
  page: printed 22
  paraphrase: It is desirable to characterise each important protocol violation by when it occurred, its cause and its influence on the trial result.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-081
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2
  page: printed 22
  paraphrase: The frequency and type of protocol violations, missing values and other problems should be documented in the clinical study report, together with their possible influence on the trial results.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-082
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2.1
  page: printed 22-23
  paraphrase: Under the intention-to-treat principle the primary analysis should include all randomised subjects; the full analysis set is as complete as possible, and only limited circumstances may justify excluding randomised subjects, such as failure to satisfy major entry criteria, taking no trial medication, or having no post-randomisation data; any exclusion should always be justified.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-083
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2.1
  page: printed 22-23
  paraphrase: Subjects who fail an entry criterion may be excluded from the full analysis set without introducing bias only if the criterion was measured before randomisation, detection of the eligibility violation is completely objective, all subjects receive equal scrutiny for such violations (which underlines the importance of blind review), and all detected violations of that criterion are excluded.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-084
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2.1
  page: printed 23
  paraphrase: When the full analysis set is used, protocol violations after randomisation may affect the data and conclusions, especially where their occurrence relates to treatment assignment; in most respects it is appropriate to include data from such subjects, consistent with intention-to-treat.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-085
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2.1
  page: printed 23
  paraphrase: Because some problems cannot be foreseen, the handling of irregularities may sometimes be deferred to the blind review at the end of the trial, if the protocol so specifies.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-086
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2.2
  page: printed 23-24 [verify]
  paraphrase: The per protocol set is the subset of the full analysis set that is more compliant with the protocol, characterised by a pre-specified minimal exposure to treatment, availability of primary variable measurements, and absence of major protocol violations, including violation of entry criteria.
  quote: the absence of any major protocol violations including the violation of entry criteria
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-087
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2.2
  page: printed 23-24 [verify]
  paraphrase: The precise reasons for excluding subjects from the per protocol set should be fully defined and documented before the blind is broken.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-088
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2.2
  page: printed 24
  paraphrase: Protocol violations other than those used to define the per protocol set should be fully identified and summarised; relevant violations may include errors in treatment assignment, use of excluded medication, poor compliance, loss to follow-up and missing data.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-089
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2.2
  page: printed 24
  paraphrase: It is good practice to assess the pattern of such problems across treatment groups with respect to frequency and time of occurrence.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-090
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S5.2.3
  page: printed 24 [verify]
  paraphrase: It is generally advantageous to show that the main results are not sensitive to the choice of analysed subjects; in confirmatory trials it is usually appropriate to plan analyses of both the full analysis set and the per protocol set so that differences can be discussed, and exclusion of a substantial proportion of subjects from the per protocol set casts some doubt on the overall validity of the trial.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-091
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S7.1
  page: printed 30
  paraphrase: Decisions taken during the blinded pre-analysis review, such as excluding subjects or data from the analysis sets, should be described in the report and distinguished from decisions taken after unblinding.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-092
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S7.1
  page: printed 30
  paraphrase: All reasons for exclusion from analysis should be documented, including, for subjects in the full analysis set but not the per protocol set, the reasons for their exclusion from the latter.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-093
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S7.1
  page: printed 30
  paraphrase: The effect on the main analyses of all losses of subjects or data, withdrawals from treatment and major protocol violations should be considered carefully.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-094
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S7.1
  page: printed 30
  paraphrase: Subjects lost to follow-up, withdrawn from treatment or with a severe protocol violation should be identified and described, including their reasons and the relationship to treatment and outcome.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-095
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: S7.2
  page: printed 31
  paraphrase: When summarising the clinical database across trials, the handling of protocol violators and deviators, together with the other conventions listed, should be kept compatible unless there are valid reasons not to.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-096
  src: E9
  doc: ICH Harmonised Tripartite Guideline E9 Statistical Principles for Clinical Trials, Current Step 4 version, 5 February 1998
  url: https://database.ich.org/sites/default/files/E9_Guideline.pdf
  loc: GL:Blind Review
  page: printed 32
  paraphrase: Blind review is the checking and assessment of data between trial completion and the breaking of the blind, in order to finalise the planned analysis.
  quote: ''
  local_text: vendor/sources/E9/doc_6.txt
- id: R2-097
  src: E9R1
  doc: ICH E9(R1) Addendum on Estimands and Sensitivity Analysis in Clinical Trials to the Guideline on Statistical Principles for Clinical Trials, Final version, Step 4, adopted 20 November 2019
  url: https://database.ich.org/sites/default/files/E9-R1_Step4_Guideline_2019_1203.pdf
  loc: SA.1
  page: printed 3
  paraphrase: The addendum revisits per protocol analysis, asking whether the need to explore the impact of protocol violations and deviations can be met in a way that is less biased and more interpretable than a naive per protocol analysis.
  quote: ''
  local_text: vendor/sources/E9R1/doc_7.txt
- id: R2-098
  src: E9R1
  doc: ICH E9(R1) Addendum on Estimands and Sensitivity Analysis in Clinical Trials to the Guideline on Statistical Principles for Clinical Trials, Final version, Step 4, adopted 20 November 2019
  url: https://database.ich.org/sites/default/files/E9-R1_Step4_Guideline_2019_1203.pdf
  loc: SA.1
  page: printed 3
  paraphrase: 'Discontinuation of randomised treatment is distinguished from withdrawal from the study: treatment discontinuation is an intercurrent event to be addressed in the estimand, whereas study withdrawal leads to missing data.'
  quote: ''
  local_text: vendor/sources/E9R1/doc_7.txt
- id: R2-099
  src: E9R1
  doc: ICH E9(R1) Addendum on Estimands and Sensitivity Analysis in Clinical Trials to the Guideline on Statistical Principles for Clinical Trials, Final version, Step 4, adopted 20 November 2019
  url: https://database.ich.org/sites/default/files/E9-R1_Step4_Guideline_2019_1203.pdf
  loc: SA.3.1
  page: printed 6
  paraphrase: Very granular events, such as a single missed dose of a chronic treatment or a dose taken at the wrong time of day, need not be handled as intercurrent events if they are not expected to affect interpretation of the variable.
  quote: ''
  local_text: vendor/sources/E9R1/doc_7.txt
- id: R2-100
  src: E9R1
  doc: ICH E9(R1) Addendum on Estimands and Sensitivity Analysis in Clinical Trials to the Guideline on Statistical Principles for Clinical Trials, Final version, Step 4, adopted 20 November 2019
  url: https://database.ich.org/sites/default/files/E9-R1_Step4_Guideline_2019_1203.pdf
  loc: SA.3.1
  page: printed 6
  paraphrase: Where the relevance of an intercurrent event depends on its reason, magnitude or timing, that additional information should be defined and recorded accurately in the trial.
  quote: ''
  local_text: vendor/sources/E9R1/doc_7.txt
- id: R2-101
  src: E9R1
  doc: ICH E9(R1) Addendum on Estimands and Sensitivity Analysis in Clinical Trials to the Guideline on Statistical Principles for Clinical Trials, Final version, Step 4, adopted 20 November 2019
  url: https://database.ich.org/sites/default/files/E9-R1_Step4_Guideline_2019_1203.pdf
  loc: SA.3.1
  page: printed 7
  paraphrase: Withdrawal from the trial and other reasons for missing data, such as administrative censoring, are not intercurrent events in themselves, although a subject may have experienced an intercurrent event before withdrawing.
  quote: ''
  local_text: vendor/sources/E9R1/doc_7.txt
- id: R2-102
  src: E9R1
  doc: ICH E9(R1) Addendum on Estimands and Sensitivity Analysis in Clinical Trials to the Guideline on Statistical Principles for Clinical Trials, Final version, Step 4, adopted 20 November 2019
