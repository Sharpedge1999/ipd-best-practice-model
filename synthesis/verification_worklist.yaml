- id: R4-065
  src: FDA-PD24
  doc: Protocol Deviations for Clinical Investigations of Drugs, Biological Products, and Devices - Draft Guidance for Industry, December 2024 (CDER, CBER, CDRH, OCE; docket FDA-2023-D-5016)
  url: https://www.fda.gov/media/184745/download
  loc: SIII.B.2
  page: printed 9; lines 305-310, footnotes 22-23
  paraphrase: Sponsors should assess the risk that critical elements are not conducted correctly, mitigate those risks, and develop study-specific plans to minimise occurrence and impact of important deviations, e.g. medical monitoring plan, safety monitoring plan, data management plan, risk-based monitoring plan, independent endpoint adjudication charter (footnotes cite FDA-RBM13, FDA-RBM23 and ICH E6(R2)).
  quote: ''
  local_text: vendor/sources/FDA-PD24/doc_29.txt
