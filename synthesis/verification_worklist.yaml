  src: EMA-E6R3
  doc: EMA web page 'ICH E6 Good clinical practice - Scientific guideline' (modified 15 July 2026) and ICH E6(R3) Step 5 cover, EMA/CHMP/ICH/135/1995, 23 January 2025
  url: https://www.ema.europa.eu/en/scientific-guidelines/ich-e6-good-clinical-practice
