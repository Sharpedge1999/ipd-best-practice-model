  src: CTTI-CTQ
  doc: 'CTTI Quality by Design Project: Critical to Quality (CTQ) Factors Principles Document, version 19 May 2015, 24 pages'
  url: https://ctti-clinicaltrials.org/wp-content/uploads/2021/07/CTTI_QbD_Workshop_Principles_Document-1.pdf
